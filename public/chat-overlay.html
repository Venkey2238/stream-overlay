<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Overlay</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Syncopate:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>

<style>
:root {

    --yt: #ff0033;
    --tw: #b05cff;
    --kk: #53fc18;

    --ash: #9ba1a8;
    --bronze: #e6883c;
    --silver: #d3e1ef;
    --gold: #ffcf33;
    --iridescent: #ff124d;

    --ease-fluid: cubic-bezier(0.25, 1, 0.2, 1);
    --ease-float: cubic-bezier(0.4, 0, 0.2, 1);

    --entity-red: #ff124d;
    --entity-dark: #25000c;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;

    font-family: 'Rajdhani', sans-serif;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

/* ========================================================================
   MASTER
   ======================================================================== */

#master-container {

    position: absolute;

    /*
       IMPORTANT:
       Increased from 30px to 44px.

       This gives the avatar and its animated aura a genuine
       safety zone so the left edge can never visually bleed.
    */

    left: 44px;
    bottom: 30px;

    width: 580px;

    display: flex;
    flex-direction: column;
    gap: 20px;

    pointer-events: none;
}

/* ========================================================================
   VIEWER HUD
   ======================================================================== */

#viewer-hud {
    display: flex;
    gap: 15px;
    z-index: 100;
}

.hud-card {

    display: none;
    align-items: center;
    gap: 12px;

    padding: 10px 20px 10px 16px;

    background: rgba(15, 15, 20, 0.4);

    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.1),
        0 8px 24px rgba(0,0,0,0.5);

    border-radius: 20px;

    transform: translateZ(0);
    will-change: transform;
}

.plt-icon {
    width: 34px;
    height: 34px;

    color: var(--plt-color);

    filter:
        drop-shadow(0 0 8px var(--plt-color));
}

.v-count {

    font-family: 'Montserrat', sans-serif;

    font-size: 2.2rem;
    font-weight: 900;

    color: #fff;

    text-shadow:
        0 4px 12px rgba(0,0,0,0.8),
        0 1px 3px rgba(0,0,0,1);
}

/* ========================================================================
   CHAT WORLD
   ======================================================================== */

#chat-widget {

    position: relative;

    width: 100%;
    height: 290px;

    perspective: 1000px;
    perspective-origin: bottom center;

    transform-style: preserve-3d;

    overflow: hidden;

    contain: layout paint size;

    mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0) 0%,
            rgba(0,0,0,1) 40%,
            rgba(0,0,0,1) 100%
        );

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0) 0%,
            rgba(0,0,0,1) 40%,
            rgba(0,0,0,1) 100%
        );
}

/* ========================================================================
   MESSAGE NODE
   ======================================================================== */

.msg-node {

    position: absolute;

    /*
       LEFT SAFETY BUFFER

       The old node started at 0px.
       The avatar aura could therefore touch the clipping boundary.

       This creates a dedicated breathing zone.
    */

    left: 18px;

    bottom: 15px;

    width: calc(100% - 18px);

    height: 115px;

    transform-origin: center bottom;

    transform-style: preserve-3d;

    transition:
        transform 0.8s var(--ease-fluid),
        opacity 0.8s var(--ease-fluid),
        filter 0.8s var(--ease-fluid);

    will-change:
        transform,
        opacity,
        filter;
}

/* ========================================================================
   CHAT POSITIONS
   ======================================================================== */

.msg-pos-1 {

    transform:
        translate3d(0,0,0)
        rotateX(0deg);

    opacity: 1;

    filter: blur(0);

    z-index: 10;
}

.msg-pos-2 {

    transform:
        translate3d(0,-125px,-60px)
        rotateX(8deg);

    opacity: 0.8;

    filter: blur(0.5px);

    z-index: 9;
}

.msg-dead {

    transform:
        translate3d(0,-250px,-150px)
        rotateX(15deg);

    opacity: 0;

    filter: blur(5px);

    pointer-events: none;
}

.msg-spawn {

    opacity: 0;

    filter: blur(10px);

    transform:
        translate3d(
            var(--spawn-x),
            var(--spawn-y),
            var(--spawn-z)
        )
        rotateX(var(--spawn-rotX))
        rotateY(var(--spawn-rotY))
        scale(var(--spawn-scale));
}

/* ========================================================================
   INTERNAL MESSAGE
   ======================================================================== */

.msg-inner {

    display: flex;
    align-items: center;

    /*
       More space between avatar and card.
    */

    gap: 23px;

    width: 100%;
    height: 100%;

    position: relative;
}

/* ========================================================================
   ENERGY TETHER
   ======================================================================== */

.msg-inner::before {

    content: '';

    position: absolute;

    /*
       Moves tether away from avatar.
    */

    left: 88px;

    top: 50%;

    transform: translateY(-50%);

    width: 34px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            var(--rank-color),
            transparent
        );

    box-shadow:
        0 0 15px var(--rank-color);

    z-index: 1;

    opacity: 0.7;
}

/* ========================================================================
   AVATAR SAFE ZONE
   ======================================================================== */

.hologram-avatar {

    position: relative;

    width: 85px;
    height: 85px;

    /*
       This is the critical fix.

       Extra isolation prevents animated rings,
       aura particles and blood effects from visually
       touching the left boundary.
    */

    margin-left: 8px;

    flex-shrink: 0;

    z-index: 5;

    display: flex;

    align-items: center;
    justify-content: center;

    isolation: isolate;
}

/* ========================================================================
   AVATAR RING
   ======================================================================== */

.avatar-ring {

    position: absolute;

    inset: -3px;

    background:
        conic-gradient(
            from 0deg,
            transparent 0%,
            var(--rank-color) 40%,
            #fff 50%,
            var(--rank-color) 60%,
            transparent 100%
        );

    animation:
        liquidMorph var(--ava-morph-speed)
        ease-in-out infinite
        alternate var(--ava-delay),

        spin var(--ava-spin-speed)
        linear infinite;

    opacity: 0.8;

    filter:
        drop-shadow(
            0 0 10px var(--rank-color)
        );

    z-index: 1;

    /*
       Keeps the aura visually attached to the avatar.
    */

    border-radius: 50%;
}

/* ========================================================================
   AVATAR IMAGE
   ======================================================================== */

.avatar-img {

    position: relative;

    width: 100%;
    height: 100%;

    object-fit: cover;

    animation:
        liquidMorph
        var(--ava-morph-speed)
        ease-in-out
        infinite
        alternate-reverse
        var(--ava-delay);

    filter:
        contrast(1.1)
        grayscale(0.05)
        saturate(1.2);

    z-index: 2;

    box-shadow:
        0 0 0 3px rgba(0,0,0,0.45),
        0 0 25px rgba(var(--rank-rgb),0.35);
}

/* ========================================================================
   LIQUID MORPH
   ======================================================================== */

@keyframes liquidMorph {

    0% {
        border-radius:
            40% 60% 70% 30%
            /
            40% 50% 60% 50%;
    }

    33% {
        border-radius:
            60% 40% 30% 70%
            /
            50% 60% 40% 50%;
    }

    66% {
        border-radius:
            50% 50% 60% 40%
            /
            60% 40% 70% 30%;
    }

    100% {
        border-radius:
            40% 60% 70% 30%
            /
            40% 50% 60% 50%;
    }
}

@keyframes spin {

    100% {
        transform: rotate(360deg);
    }
}

/* ========================================================================
   CONTENT BLOCK
   ======================================================================== */

.content-block {

    position: relative;

    flex: 1;

    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding:
        12px
        18px
        16px
        20px;

    background:
        linear-gradient(
            135deg,
            rgba(20,20,25,0.4) 0%,
            rgba(10,10,15,0.7) 100%
        );

    backdrop-filter:
        blur(24px)
        saturate(200%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(200%);

    border-radius: 22px;

    box-shadow:

        inset 0 0 0 1px
        rgba(255,255,255,0.08),

        inset 4px 0 12px
        rgba(var(--rank-rgb),0.3),

        0 10px 30px
        rgba(0,0,0,0.5);

    overflow: hidden;

    z-index: 2;
}

/* ========================================================================
   HOLOGRAPHIC INTERNAL LIGHT
   ======================================================================== */

.content-block::before {

    content: '';

    position: absolute;

    top: -50%;
    left: -50%;

    width: 200%;
    height: 200%;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(var(--rank-rgb),0.1) 0%,
            transparent 60%
        );

    animation:
        holoPulse
        4s ease-in-out
        infinite alternate
        var(--ava-delay);

    pointer-events: none;

    z-index: -1;
}

@keyframes holoPulse {

    0% {
        opacity: 0.3;
        transform: scale(0.9);
    }

    100% {
        opacity: 1;
        transform: scale(1.1);
    }
}

/* ========================================================================
   USER ROW
   ======================================================================== */

.user-row {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 2px;

    z-index: 2;

    position: relative;
}

.chat-plt-icon {

    width: 16px;
    height: 16px;

    color: var(--plt-color);
}

.username {

    font-family:
        'Syncopate',
        sans-serif;

    font-size: 0.85rem;

    font-weight: 900;

    color: var(--rank-color);

    text-transform: uppercase;

    letter-spacing: 1px;

    text-shadow:
        0 2px 6px rgba(0,0,0,0.9),
        0 0 2px rgba(0,0,0,1);

    max-width: 200px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

/* ========================================================================
   CHAT TEXT
   ======================================================================== */

.chat-text {

    position: relative;

    z-index: 2;

    font-family:
        'Montserrat',
        sans-serif;

    font-size: 1.55rem;

    font-weight: 800;

    line-height: 1.2;

    color: #fff;

    text-shadow:

        0 4px 12px rgba(0,0,0,0.95),

        0 1px 3px rgba(0,0,0,1),

        0 8px 24px rgba(0,0,0,0.6);

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;

    word-wrap: break-word;
}

/* ========================================================================
   BADGES
   ======================================================================== */

.badge-container {

    position: absolute;

    right: 14px;
    top: 12px;

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 3;
}

.tier-badge {

    background:
        rgba(0,0,0,0.6);

    box-shadow:

        inset 0 0 0 1px
        rgba(255,255,255,0.1),

        0 2px 8px
        rgba(0,0,0,0.5);

    padding:
        4px 12px;

    border-radius: 12px;

    color: #fff;

    font-family:
        'Syncopate',
        sans-serif;

    font-size: 0.6rem;

    font-weight: 900;
}

/* ========================================================================
   PROGRESS
   ======================================================================== */

.gen-progress-container {

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 4px;

    background:
        rgba(0,0,0,0.5);

    border-radius:
        0 0 22px 22px;

    overflow: hidden;
}

.gen-fill {

    height: 100%;

    background:
        var(--rank-color);

    box-shadow:
        0 0 12px var(--rank-color);

    transition:
        width 1s var(--ease-fluid);

    position: relative;
}

.gen-fill::after {

    content: '';

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.9),
            transparent
        );

    animation:
        energyFlow
        2s linear
        infinite;
}

@keyframes energyFlow {

    0% {
        transform: translateX(-100%);
    }

    100% {
        transform: translateX(100%);
    }
}

/* ========================================================================
   BP POPUP
   ======================================================================== */

.bp-popup {

    position: absolute;

    top: 0;
    left: 50%;

    transform:
        translate(-50%,0);

    font-family:
        'Montserrat',
        sans-serif;

    font-weight: 900;

    font-size: 1.2rem;

    color:
        var(--entity-red);

    text-shadow:
        0 2px 8px rgba(0,0,0,1),
        0 0 2px rgba(0,0,0,1);

    white-space: nowrap;

    z-index: 50;

    pointer-events: none;

    animation:
        bpFloat
        1.5s
        var(--ease-float)
        forwards;
}

@keyframes bpFloat {

    0% {
        opacity: 0;
        transform:
            translate(-50%,5px)
            scale(0.6);
    }

    20% {
        opacity: 1;
        transform:
            translate(-50%,-15px)
            scale(1.1);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%,-40px)
            scale(0.9);
    }
}

/* ========================================================================
   ENTITY REACTION SYSTEM
   ======================================================================== */

.entity-reaction-layer {

    position: absolute;

    inset: -30px;

    pointer-events: none;

    z-index: 40;

    overflow: visible;
}

/* ========================================================================
   AURA
   ======================================================================== */

.entity-aura {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 150px;
    height: 150px;

    transform:
        translate(-50%,-50%)
        scale(0.4);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(var(--rank-rgb),0.28),
            rgba(var(--rank-rgb),0.08) 35%,
            transparent 70%
        );

    filter:
        blur(8px);

    opacity: 0;

    animation:
        auraBurst
        1.5s
        var(--ease-fluid)
        forwards;
}

@keyframes auraBurst {

    0% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(0.3);
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(1.7);
    }
}

/* ========================================================================
   SCRATCH MARKS
   ======================================================================== */

.scratch-marks {

    position: absolute;

    right: 5px;
    top: 50%;

    width: 95px;
    height: 70px;

    transform:
        translateY(-50%)
        rotate(var(--scratch-rotation));

    opacity: 0;

    animation:
        scratchReveal
        0.9s
        var(--ease-fluid)
        forwards;
}

.scratch-marks span {

    position: absolute;

    width: 4px;

    height: 50px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            #ff173f,
            rgba(255,23,63,0.1)
        );

    box-shadow:
        0 0 10px rgba(255,18,77,0.9);

    transform:
        rotate(var(--scratch-angle));
}

.scratch-marks span:nth-child(1) {
    left: 5px;
}

.scratch-marks span:nth-child(2) {
    left: 30px;
}

.scratch-marks span:nth-child(3) {
    left: 55px;
}

@keyframes scratchReveal {

    0% {
        opacity: 0;
        transform:
            translateY(-50%)
            translateX(25px)
            rotate(var(--scratch-rotation))
            scale(0.7);
        filter: blur(5px);
    }

    30% {
        opacity: 1;
        filter: blur(0);
    }

    100% {
        opacity: 0;
        transform:
            translateY(-50%)
            translateX(-20px)
            rotate(var(--scratch-rotation))
            scale(1.05);
    }
}

/* ========================================================================
   BLOOD PARTICLES
   ======================================================================== */

.blood-particle {

    position: absolute;

    width: var(--particle-size);
    height: var(--particle-size);

    left: var(--particle-x);
    top: var(--particle-y);

    background:
        var(--entity-red);

    border-radius:
        50% 40% 60% 40%;

    box-shadow:
        0 0 8px rgba(255,18,77,0.8);

    opacity: 0;

    animation:
        bloodFly
        var(--particle-duration)
        var(--ease-fluid)
        forwards;
}

@keyframes bloodFly {

    0% {
        opacity: 0;
        transform:
            translate(0,0)
            scale(0.2);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate(
                var(--particle-dx),
                var(--particle-dy)
            )
            scale(0.5);
    }
}

/* ========================================================================
   ENTITY TENDRILS
   ======================================================================== */

.entity-tendril {

    position: absolute;

    width: 160px;
    height: 2px;

    left: 50%;
    top: 50%;

    transform-origin: left center;

    background:
        linear-gradient(
            90deg,
            rgba(255,18,77,0.95),
            rgba(255,18,77,0.3),
            transparent
        );

    box-shadow:
        0 0 12px #ff124d;

    opacity: 0;

    animation:
        tendrilStrike
        1.1s
        var(--ease-fluid)
        forwards;
}

@keyframes tendrilStrike {

    0% {
        opacity: 0;
        transform:
            rotate(var(--tendril-angle))
            scaleX(0);
    }

    20% {
        opacity: 1;
    }

    70% {
        opacity: 0.8;
        transform:
            rotate(var(--tendril-angle))
            scaleX(1);
    }

    100% {
        opacity: 0;
        transform:
            rotate(var(--tendril-angle))
            scaleX(1.15);
    }
}

/* ========================================================================
   BLOOD WEB
   ======================================================================== */

.blood-web {

    position: absolute;

    width: 170px;
    height: 170px;

    right: 10px;
    top: 50%;

    transform:
        translateY(-50%)
        scale(0.2);

    opacity: 0;

    animation:
        webAppear
        1.8s
        var(--ease-fluid)
        forwards;
}

.blood-web::before,
.blood-web::after {

    content: '';

    position: absolute;

    inset: 15px;

    border:
        1px solid rgba(255,18,77,0.65);

    border-radius: 50%;

    box-shadow:
        0 0 15px rgba(255,18,77,0.35);
}

.blood-web::after {

    inset: 35px;

    border-color:
        rgba(255,100,120,0.45);
}

.web-line {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 1px;
    height: 100%;

    background:
        linear-gradient(
            transparent,
            #ff124d,
            transparent
        );

    transform:
        translate(-50%,-50%)
        rotate(var(--web-angle));

    box-shadow:
        0 0 8px #ff124d;
}

@keyframes webAppear {

    0% {
        opacity: 0;
        transform:
            translateY(-50%)
            scale(0.15)
            rotate(-25deg);
    }

    25% {
        opacity: 0.8;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-50%)
            scale(1.1)
            rotate(20deg);
    }
}

/* ========================================================================
   ENTITY EYE
   ======================================================================== */

.entity-eye {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 80px;
    height: 45px;

    transform:
        translate(-50%,-50%)
        scale(0.1);

    opacity: 0;

    background:
        radial-gradient(
            ellipse,
            #ffb0bb 0%,
            #ff124d 25%,
            #650018 48%,
            transparent 70%
        );

    filter:
        drop-shadow(0 0 20px #ff124d);

    animation:
        eyeOpen
        1.3s
        var(--ease-fluid)
        forwards;
}

.entity-eye::after {

    content: '';

    position: absolute;

    left: 50%;
    top: 50%;

    width: 12px;
    height: 32px;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background: #080008;

    box-shadow:
        0 0 8px #000;
}

@keyframes eyeOpen {

    0% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scaleX(0.05)
            scaleY(0.1);
    }

    25% {
        opacity: 1;
    }

    55% {
        transform:
            translate(-50%,-50%)
            scaleX(1)
            scaleY(1);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scaleX(1.3)
            scaleY(0.3);
    }
}

/* ========================================================================
   SKILL CHECK
   ======================================================================== */

.skill-check {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 145px;
    height: 145px;

    transform:
        translate(-50%,-50%)
        scale(0.7);

    border-radius: 50%;

    border:
        3px solid rgba(255,255,255,0.25);

    box-shadow:
        0 0 30px rgba(255,255,255,0.12);

    opacity: 0;

    animation:
        skillAppear
        1.45s
        var(--ease-fluid)
        forwards;
}

.skill-check::before {

    content: '';

    position: absolute;

    inset: 12px;

    border-radius: 50%;

    border:
        8px solid rgba(255,255,255,0.08);

    border-top-color:
        #ff124d;

    transform:
        rotate(var(--skill-start));

    box-shadow:
        0 0 18px rgba(255,18,77,0.5);
}

.skill-check::after {

    content:
        'GREAT';

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    font-family:
        'Syncopate',
        sans-serif;

    font-size: 0.65rem;

    font-weight: 900;

    letter-spacing: 2px;

    color: #fff;

    text-shadow:
        0 0 10px #fff;
}

@keyframes skillAppear {

    0% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(0.4)
            rotate(-30deg);
    }

    15% {
        opacity: 1;
    }

    55% {
        transform:
            translate(-50%,-50%)
            scale(1)
            rotate(0deg);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(1.25)
            rotate(15deg);
    }
}

/* ========================================================================
   HEARTBEAT
   ======================================================================== */

.heartbeat {

    position: absolute;

    inset: 0;

    border-radius: 22px;

    border:
        1px solid rgba(255,18,77,0);

    animation:
        heartbeatFlash
        1.1s
        ease-out
        forwards;
}

@keyframes heartbeatFlash {

    0% {
        opacity: 0;
        border-color:
            rgba(255,18,77,0);
        box-shadow:
            inset 0 0 0
            rgba(255,18,77,0);
    }

    25% {
        opacity: 1;
        border-color:
            rgba(255,18,77,0.9);
        box-shadow:
            inset 0 0 35px
            rgba(255,18,77,0.3),
            0 0 25px
            rgba(255,18,77,0.35);
    }

    45% {
        opacity: 0.4;
    }

    65% {
        opacity: 1;
        border-color:
            rgba(255,18,77,0.65);
    }

    100% {
        opacity: 0;
    }
}

/* ========================================================================
   SKILL CHECK UNLOCK
   ======================================================================== */

.role-unlock .content-block::after {

    content:
        'GREAT SKILL CHECK';

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(255,255,255,0.9);

    color: #000;

    font-family:
        'Syncopate',
        sans-serif;

    font-weight: 900;

    font-size: 1.6rem;

    z-index: 50;

    border-radius: 22px;

    animation:
        skillCheckFluid
        1.2s
        var(--ease-fluid)
        forwards;
}

@keyframes skillCheckFluid {

    0% {
        opacity: 0;
        transform:
            scale(0.9);
        filter: blur(5px);
    }

    15% {
        opacity: 1;
        transform:
            scale(1);
        filter: blur(0);
    }

    100% {
        opacity: 0;
        transform:
            scale(1.05);
        filter: blur(10px);
    }
}

/* ========================================================================
   STATUS
   ======================================================================== */

.status-icon {

    width: 20px;
    height: 20px;

    background:
        var(--rank-color);

    mask:
        url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M13 2.05v3.03c3.39.49 6 3.39 6 6.92 0 .9-.18 1.75-.5 2.54l2.25 2.25c.76-1.41 1.25-3.03 1.25-4.79 0-5.18-3.95-9.45-9-9.95z"/></svg>')
        center/contain no-repeat;

    -webkit-mask:
        url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M13 2.05v3.03c3.39.49 6 3.39 6 6.92 0 .9-.18 1.75-.5 2.54l2.25 2.25c.76-1.41 1.25-3.03 1.25-4.79 0-5.18-3.95-9.45-9-9.95z"/></svg>')
        center/contain no-repeat;

    animation:
        pulseStatus
        2s
        ease-in-out
        infinite alternate
        var(--ava-delay);
}

@keyframes pulseStatus {

    0% {
        transform: scale(1);
        opacity: 0.7;
    }

    100% {
        transform: scale(1.15);
        opacity: 1;
        filter:
            drop-shadow(
                0 0 6px
                var(--rank-color)
            );
    }
}

<script>

/* ========================================================================
   PLATFORM SVG

const SVGS = {

        >

            />

};


/* ========================================================================
   DBD RANKS
   ======================================================================== */

const DBD_ROLES = [

    {
        name: 'ASH IV',
        limit: 2,
        cls: 'role-1'
    },

    {
        name: 'ASH I',
        limit: 4,
        cls: 'role-2'
    },

    {
        name: 'BRONZE IV',
        limit: 7,
        cls: 'role-3'
    },

    {
        name: 'BRONZE I',
        limit: 12,
        cls: 'role-4'
    },

    {
        name: 'SILVER IV',
        limit: 18,
        cls: 'role-5'
    },

    {
        name: 'SILVER I',
        limit: 25,
        cls: 'role-6'
    },

    {
        name: 'GOLD IV',
        limit: 35,
        cls: 'role-7'
    },

    {
        name: 'GOLD I',
        limit: 50,
        cls: 'role-8'
    },

    {
        name: 'IRIDESCENT IV',
        limit: 75,
        cls: 'role-9'
    },

    {
        name: 'IRIDESCENT I',
        limit: 9999,
        cls: 'role-10'
    }

];


/* ========================================================================
   HOLOGRAPHIC CHAT ENGINE
   ======================================================================== */

class HolographicChatEngine {

    constructor() {

        this.container =
            document.getElementById('chat-widget');

        this.viewerProfiles =
            new Map();

        /*
           Used so the same viewer doesn't receive
           the same reaction repeatedly.
        */

        this.viewerReactions =
            new Map();
    }


    /* ====================================================================
       ROLE
       ==================================================================== */

    getRoleData(username) {

        const key =
            String(username)
                .trim()
                .toLowerCase();

        if (!this.viewerProfiles.has(key)) {

            this.viewerProfiles.set(
                key,
                {
                    msgs: 0,
                    idx: 0
                }
            );
        }

        const p =
            this.viewerProfiles.get(key);

        p.msgs++;

        let nIdx = 0;

        for (
            let i = 0;
            i < DBD_ROLES.length;
            i++
        ) {

            if (
                p.msgs >=
                DBD_ROLES[i].limit
            ) {

                nIdx = i + 1;

            } else {

                break;
            }
        }

        if (
            nIdx >=
            DBD_ROLES.length
        ) {

            nIdx =
                DBD_ROLES.length - 1;
        }

        const unlocked =
            nIdx > p.idx;

        p.idx = nIdx;

        const currLimit =
            nIdx === 0
                ? 0
                : DBD_ROLES[nIdx - 1].limit;

        const progress =
            (
                (p.msgs - currLimit) /
                (
                    DBD_ROLES[nIdx].limit -
                    currLimit
                )
            ) * 100;

        return {

            role:
                DBD_ROLES[nIdx],

            unlocked,

            progress:
                Math.min(
                    progress,
                    100
                )
        };
    }


    /* ====================================================================
       ESCAPE HTML
       ==================================================================== */

    escape(val) {

        return String(val ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }


    /* ====================================================================
       UNIQUE REACTION
       ==================================================================== */

    getReaction(username, roleIndex) {

        const key =
            String(username)
                .trim()
                .toLowerCase();

        if (!this.viewerReactions.has(key)) {

            this.viewerReactions.set(
                key,
                {
                    last: -1
                }
            );
        }

        const profile =
            this.viewerReactions.get(key);

        /*
           Higher rank =
           slightly more exotic reactions.
        */

        let pool = [

            'aura',
            'scratch',
            'blood',
            'tendril',
            'heartbeat'

        ];

        if (roleIndex >= 3) {

            pool.push(
                'skill',
                'web'
            );
        }

        if (roleIndex >= 6) {

            pool.push(
                'eye',
                'skill',
                'web',
                'tendril'
            );
        }

        let reaction;

        do {

            reaction =
                pool[
                    Math.floor(
                        Math.random() *
                        pool.length
                    )
                ];

        } while (
            reaction === profile.last &&
            pool.length > 1
        );

        profile.last = reaction;

        return reaction;
    }


    /* ====================================================================
       CREATE REACTION
       ==================================================================== */

    createReaction(
        reaction,
        node
    ) {

        const layer =
            document.createElement('div');

        layer.className =
            'entity-reaction-layer';


        /* ---------------------------------------------------------------
           AURA
           --------------------------------------------------------------- */

        if (reaction === 'aura') {

            const aura =
                document.createElement('div');

            aura.className =
                'entity-aura';

            layer.appendChild(aura);
        }


        /* ---------------------------------------------------------------
           SCRATCH MARKS
           --------------------------------------------------------------- */

        if (reaction === 'scratch') {

            const scratches =
                document.createElement('div');

            scratches.className =
                'scratch-marks';

            scratches.style.setProperty(
                '--scratch-rotation',
                `${Math.random() * 30 - 15}deg`
            );

            for (
                let i = 0;
                i < 3;
                i++
            ) {

                const line =
                    document.createElement('span');

                line.style.setProperty(
                    '--scratch-angle',
                    `${Math.random() * 20 - 10}deg`
                );

                scratches.appendChild(line);
            }

            layer.appendChild(scratches);
        }


        /* ---------------------------------------------------------------
           BLOOD PARTICLES
           --------------------------------------------------------------- */

        if (reaction === 'blood') {

            for (
                let i = 0;
                i < 13;
                i++
            ) {

                const particle =
                    document.createElement('div');

                particle.className =
                    'blood-particle';

                particle.style.setProperty(
                    '--particle-size',
                    `${Math.random() * 5 + 2}px`
                );

                particle.style.setProperty(
                    '--particle-x',
                    `${Math.random() * 100}%`
                );

                particle.style.setProperty(
                    '--particle-y',
                    `${Math.random() * 100}%`
                );

                particle.style.setProperty(
                    '--particle-dx',
                    `${Math.random() * 130 - 65}px`
                );

                particle.style.setProperty(
                    '--particle-dy',
                    `${Math.random() * -90 - 10}px`
                );

                particle.style.setProperty(
                    '--particle-duration',
                    `${Math.random() * 0.6 + 0.7}s`
                );

                layer.appendChild(particle);
            }
        }


        /* ---------------------------------------------------------------
           ENTITY TENDRILS
           --------------------------------------------------------------- */

        if (reaction === 'tendril') {

            for (
                let i = 0;
                i < 4;
                i++
            ) {

                const tendril =
                    document.createElement('div');

                tendril.className =
                    'entity-tendril';

                tendril.style.setProperty(
                    '--tendril-angle',
                    `${i * 90 + Math.random() * 25 - 12}deg`
                );

                tendril.style.animationDelay =
                    `${i * 0.04}s`;

                layer.appendChild(tendril);
            }
        }


        /* ---------------------------------------------------------------
           BLOOD WEB
           --------------------------------------------------------------- */

        if (reaction === 'web') {

            const web =
                document.createElement('div');

            web.className =
                'blood-web';

            for (
                let i = 0;
                i < 6;
                i++
            ) {

                const line =
                    document.createElement('div');

                line.className =
                    'web-line';

                line.style.setProperty(
                    '--web-angle',
                    `${i * 30}deg`
                );

                web.appendChild(line);
            }

            layer.appendChild(web);
        }


        /* ---------------------------------------------------------------
           ENTITY EYE
           --------------------------------------------------------------- */

        if (reaction === 'eye') {

            const eye =
                document.createElement('div');

            eye.className =
                'entity-eye';

            layer.appendChild(eye);
        }


        /* ---------------------------------------------------------------
           SKILL CHECK
           --------------------------------------------------------------- */

        if (reaction === 'skill') {

            const skill =
                document.createElement('div');

            skill.className =
                'skill-check';

            skill.style.setProperty(
                '--skill-start',
                `${Math.random() * 360}deg`
            );

            layer.appendChild(skill);
        }


        /* ---------------------------------------------------------------
           HEARTBEAT
           --------------------------------------------------------------- */

        if (reaction === 'heartbeat') {

            const heartbeat =
                document.createElement('div');

            heartbeat.className =
                'heartbeat';

            layer.appendChild(heartbeat);
        }


        node.appendChild(layer);

        /*
           Reaction removes itself.
        */

        setTimeout(() => {

            if (layer.parentNode) {

                layer.remove();
            }

        }, 2200);
    }


    /* ====================================================================
       MESSAGE
       ==================================================================== */

    addMessage(
        username,
        message,
        avatarUrl,
        platform
    ) {

        const roleData =
            this.getRoleData(username);

        const safeName =
            this.escape(username);

        const safeMsg =
            this.escape(message);

        const safeAva =
            this.escape(avatarUrl);

        const roleIndex =
            DBD_ROLES.indexOf(
                roleData.role
            );

        const bpEarned =
            Math.floor(
                Math.random() * 200
            ) + 50;

        const hasStatus =
            roleIndex >= 6
                ? '<div class="status-icon"></div>'
                : '';

        const reaction =
            this.getReaction(
                username,
                roleIndex
            );

        const node =
            document.createElement('div');


        /* ================================================================
           UNIQUE PHYSICS
           ================================================================ */

        node.style.setProperty(
            '--spawn-x',
            `${Math.random() * 100 - 50}px`
        );

        node.style.setProperty(
            '--spawn-y',
            `${Math.random() * 60 + 30}px`
        );

        node.style.setProperty(
            '--spawn-z',
            `${Math.random() * 150 + 100}px`
        );

        node.style.setProperty(
            '--spawn-rotX',
            `${Math.random() * 30 - 15}deg`
        );

        node.style.setProperty(
            '--spawn-rotY',
            `${Math.random() * 30 - 15}deg`
        );

        node.style.setProperty(
            '--spawn-scale',
            `${Math.random() * 0.15 + 0.85}`
        );


        /* ================================================================
           UNIQUE AVATAR
           ================================================================ */

        node.style.setProperty(
            '--ava-morph-speed',
            `${(
                Math.random() * 4 + 3
            ).toFixed(1)}s`
        );

        node.style.setProperty(
            '--ava-spin-speed',
            `${(
                Math.random() * 8 + 4
            ).toFixed(1)}s`
        );

        node.style.setProperty(
            '--ava-delay',
            `-${(
                Math.random() * 5
            ).toFixed(1)}s`
        );


        node.style.setProperty(
            '--plt-color',
            `var(--${platform})`
        );


        node.className =
            `
            msg-node
            msg-spawn
            ${roleData.role.cls}
            ${roleData.unlocked ? 'role-unlock' : ''}
            `;


        node.innerHTML = `

            <div class="msg-inner">

                <div class="hologram-avatar">

                    <div class="avatar-ring"></div>

                    <img
                        src="${safeAva}"
                        class="avatar-img"
                        alt=""
                    >

                    <div class="bp-popup">
                        +${bpEarned}
                    </div>

                </div>


                <div class="content-block">

                    <div class="badge-container">

                        ${hasStatus}

                        <div class="tier-badge">
                            ${roleData.role.name}
                        </div>

                    </div>


                    <div class="user-row">

                        ${SVGS[platform]}

                        <span class="username">
                            ${safeName}
                        </span>

                    </div>


                    <div class="chat-text">
                        ${safeMsg}
                    </div>


                    <div class="gen-progress-container">

                        <div
                            class="gen-fill"
                            style="
                                width:
                                ${roleData.progress}%
                            "
                        ></div>

                    </div>

                </div>

            </div>
        `;


        /*
           Add message first so the reaction
           is correctly positioned relative to it.
        */

        this.container.prepend(node);


        /*
           Force browser layout.
        */

        void node.offsetWidth;


        /*
           Animate into position.
        */

        this.updateZDepth();


        /*
           DBD reaction starts just after
           the message begins entering.
        */

        setTimeout(() => {

            if (
                node.parentNode
            ) {

                this.createReaction(
                    reaction,
                    node
                );
            }

        }, 180);


        /*
           Extra unlock reaction.

           Rank-up messages get both:
           GREAT SKILL CHECK
           + another Entity reaction.
        */

        if (roleData.unlocked) {

            setTimeout(() => {

                if (
                    node.parentNode
                ) {

                    this.createReaction(
                        'skill',
                        node
                    );
                }

            }, 650);
        }
    }


    /* ====================================================================
       STRICT TWO MESSAGE ENGINE
       ==================================================================== */

    updateZDepth() {

        const messages =
            Array.from(
                this.container.children
            );


        messages.forEach(
            (msg, i) => {

                msg.classList.remove(
                    'msg-spawn',
                    'msg-pos-1',
                    'msg-pos-2',
                    'msg-dead'
                );


                if (i === 0) {

                    msg.classList.add(
                        'msg-pos-1'
                    );

                }

                else if (i === 1) {

                    msg.classList.add(
                        'msg-pos-2'
                    );

                }

                else {

                    msg.classList.add(
                        'msg-dead'
                    );


                    setTimeout(() => {

                        if (
                            msg.parentNode
                        ) {

                            msg.remove();
                        }

                    }, 800);
                }

            }
        );
    }
}


/* ========================================================================
   VIEWER ENGINE
   ======================================================================== */

class ViewerEngine {

    constructor() {

        this.state = {
            yt: 0,
            tw: 0,
            kk: 0
        };
    }


    update(
        plt,
        count
    ) {

        const node =
            document.getElementById(
                `node-${plt}`
            );

        if (
            node.style.display !== 'flex'
        ) {

            node.style.display =
                'flex';
        }


        if (
            count !==
            this.state[plt]
        ) {

            this.state[plt] =
                count;

            document.getElementById(
                `count-${plt}`
            ).innerText =
                count.toLocaleString(
                    'en-US'
                );
        }
    }


    async pollExternal(
        tw,
        kk
    ) {

        if (tw) {

            try {

                const r =
                    await fetch(
                        `https://decapi.me/twitch/viewercount/${tw}`
                    );

                this.update(
                    'tw',
                    parseInt(
                        await r.text()
                    ) || 0
                );

            } catch(e) {}
        }


        if (kk) {

            let k =
                kk.includes("|||")
                    ? kk.split("|||")[0]
                    : (
                        isNaN(kk)
                            ? kk
                            : ""
                    );

            if (k) {

                try {

                    const r =
                        await fetch(
                            `/api/kick_viewers/${k}`
                        );

                    const d =
                        await r.json();

                    if (
                        d &&
                        d.viewers !== undefined
                    ) {

                        this.update(
                            'kk',
                            d.viewers
                        );
                    }

                } catch(e) {}
            }
        }
    }
}


/* ========================================================================
   MASTER ENGINE
   ======================================================================== */

class MasterUnifiedEngine {

    constructor(
        cEng,
        vEng,
        handle
    ) {

        this.c = cEng;

        this.v = vEng;

        this.h = handle;

        this.q = [];

        this.config = {
            tw: "",
            kk: ""
        };


        if (!this.h) {

            this.demo();

        } else {

            this.start();
        }


        /*
           2.5 seconds keeps the two-card
           presentation readable.
        */

        setInterval(
            () => this.process(),
            2500
        );
    }


    async start() {

        try {

            const r =
                await fetch(
                    `/api/streamer/${this.h}`
                );

            const d =
                await r.json();


            if (
                d.authenticated
            ) {

                this.config.tw =
                    d.twitch_user;

                this.config.kk =
                    d.kick_user;


                this.v.pollExternal(
                    this.config.tw,
                    this.config.kk
                );


                if (
                    this.config.tw
                ) {

                    this.connTw(
                        this.config.tw
                    );
                }


                if (
                    this.config.kk
                ) {

                    let kid =
                        this.config.kk.includes("|||")
                            ? this.config.kk.split("|||")[1]
                            : this.config.kk;


                    if (kid) {

                        this.connKk(kid);
                    }
                }
            }

        } catch(e) {}
    }


    /* ====================================================================
       TWITCH
       ==================================================================== */

    connTw(ch) {

        const ws =
            new WebSocket(
                'wss://irc-ws.chat.twitch.tv:443'
            );


        ws.onopen = () => {

            ws.send(
                'CAP REQ :twitch.tv/tags twitch.tv/commands'
            );

            ws.send(
                `NICK jf${Math.random()}`
            );

            ws.send(
                `JOIN #${ch.toLowerCase()}`
            );
        };


        ws.onmessage = (e) => {

            const lines =
                e.data.split('\r\n');


            for (
                let l of lines
            ) {

                if (
                    l ===
                    'PING :tmi.twitch.tv'
                ) {

                    ws.send(
                        'PONG :tmi.twitch.tv'
                    );
                }

                else if (
                    l.includes('PRIVMSG')
                ) {

                    const nm =
                        l.match(
                            /display-name=([^;]+)/
                        );

                    const m =
                        l.match(
                            /PRIVMSG #[^:]+:(.+)/
                        );


                    if (
                        nm &&
                        m
                    ) {

                        this.q.push({

                            u: nm[1],

                            m: m[1],

                            p: 'tw',

                            a:
                                `https://ui-avatars.com/api/?name=${nm[1]}&background=random&color=fff&bold=true`
                        });
                    }
                }
            }
        };
    }


    /* ====================================================================
       KICK
       ==================================================================== */

    connKk(id) {

        if (
            !/^\d+$/.test(id)
        ) {

            return;
        }


        const p =
            new Pusher(
                'eb1d5f283081a78b932c',
                {
                    cluster: 'us2',
                    forceTLS: true
                }
            );


        p.subscribe(
            `chatrooms.${id}.v2`
        )
        .bind(
            'App\\Events\\ChatMessageEvent',
            (d) => {

                this.q.push({

                    u:
                        d.sender.username,

                    m:
                        d.content,

                    p:
                        'kk',

                    a:
                        d.sender.identity.profile_pic ||
                        `https://ui-avatars.com/api/?name=${d.sender.username}&background=random&color=fff&bold=true`
                });
            }
        );
    }


    /* ====================================================================
       QUEUE
       ==================================================================== */

    process() {

        if (
            this.q.length > 0
        ) {

            const msg =
                this.q.shift();

            this.c.addMessage(
                msg.u,
                msg.m,
                msg.a,
                msg.p
            );
        }
    }


    /* ====================================================================
       DEMO
       ==================================================================== */

    demo() {

        [
            'yt',
            'tw',
            'kk'
        ].forEach(
            p => {

                document.getElementById(
                    `node-${p}`
                ).style.display =
                    'flex';
            }
        );


        setInterval(
            () => {

                this.v.update(
                    'yt',
                    Math.floor(
                        Math.random() * 50
                    ) + 1200
                );

            },
            5000
        );


        const bot = () => {

            const plts =
                ['yt','tw','kk'];

            const plt =
                plts[
                    Math.floor(
                        Math.random() *
                        plts.length
                    )
                ];


            const users = [

                'Entity_Prey',
                'Meg_Main',
                'Hex_Ruin',
                'Boon_User',
                'Nancy_AI',
                'Killer_Shack',
                'Bloodweb_Surfer',
                'The_Entity',
                'Loop_God',
                'Generator_Main'

            ];


            const msgs = [

                "The Entity demands a sacrifice.",

                "Gen rushing again?",

                "Looping shack all day.",

                "Dropped a god pallet!",

                "Flashlight save incoming!!",

                "These animations are insane.",

                "I need that next BP rank.",

                "The Entity noticed me.",

                "That skill check was CLEAN.",

                "One more game.",

                "Okay THAT aura was sick."

            ];


            const u =
                users[
                    Math.floor(
                        Math.random() *
                        users.length
                    )
                ];


            const m =
                msgs[
                    Math.floor(
                        Math.random() *
                        msgs.length
                    )
                ];


            this.q.push({

                u,

                m,

                a:
                    `https://ui-avatars.com/api/?name=${u}&background=random&color=fff&bold=true`,

                p:
                    plt
            });


            setTimeout(
                bot,
                Math.random() * 2500 + 1000
            );
        };


        setTimeout(
            bot,
            1000
        );
    }
}

);

</script>
