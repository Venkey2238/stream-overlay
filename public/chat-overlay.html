<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Unified Multi-Platform Kinetic Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Syncopate:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ease-punch: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --ease-snap: cubic-bezier(0.86, 0, 0.07, 1);
            --ease-glide: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-fluid: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-bounce: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-cyber: cubic-bezier(0.77, 0, 0.175, 1);
        }

        body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: transparent; 
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #chat-widget {
            position: absolute;
            bottom: 50px; left: 50px;
            width: 500px; 
            display: flex; flex-direction: column; justify-content: flex-end;
            gap: 0; perspective: 2000px; transform-style: preserve-3d; z-index: 10;
        }

        .msg-wrapper {
            position: relative; max-height: 250px; margin-top: 25px; opacity: 1;
            transform-origin: left center; will-change: max-height, margin-top, opacity;
            transition: max-height 0.6s var(--ease-cyber), margin-top 0.6s var(--ease-cyber), opacity 0.4s ease-out;
        }

        .msg-wrapper.collapsing {
            max-height: 0 !important; margin-top: 0 !important;
            opacity: 0; overflow: hidden; pointer-events: none;
        }

        .cyber-thread {
            display: flex; align-items: flex-start; gap: 20px;
            position: relative; transform-style: preserve-3d;
            filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.8)) drop-shadow(0px 0px 8px var(--accent));
        }

        .hud-line {
            position: absolute; left: 27px; top: 60px; bottom: -15px; width: 2px;
            background: linear-gradient(to bottom, var(--accent), transparent);
            opacity: 0.6; z-index: 0; transform-origin: top; will-change: transform, opacity;
        }

        .avatar-node {
            position: relative; flex-shrink: 0; width: 56px; height: 56px;
            z-index: 2; will-change: transform, filter;
        }

        .avatar-node::before {
            content: ''; position: absolute; inset: -6px;
            border: 1px dashed var(--accent); border-radius: 50%;
            animation: spinRing 10s linear infinite; opacity: 0.8;
        }

        .avatar-node::after {
            content: ''; position: absolute; inset: -2px;
            border: 2px solid var(--accent); border-radius: 50%;
            box-shadow: 0 0 15px var(--accent); opacity: 0.5;
        }

        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        .avatar {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            filter: grayscale(20%) contrast(120%);
            mask-image: radial-gradient(circle, black 60%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle, black 60%, transparent 100%);
        }

        .text-cluster {
            display: flex; flex-direction: column; justify-content: flex-start;
            flex-grow: 1; padding-top: 5px; z-index: 2; transform-style: preserve-3d;
        }

        .username-glitch {
            font-family: 'Syncopate', sans-serif; font-size: 0.65rem; font-weight: 900;
            letter-spacing: 0.35em; color: var(--accent); text-transform: uppercase;
            margin-bottom: 2px; position: relative; display: inline-block;
            will-change: transform, opacity, letter-spacing;
        }

        .message-kinetic {
            font-family: 'Montserrat', sans-serif; font-size: 1.3rem; font-weight: 900;
            line-height: 1.3; letter-spacing: -0.02em;
            background: linear-gradient(110deg, #ffffff 0%, #e0e0e0 40%, var(--accent) 50%, #ffffff 60%, #ffffff 100%);
            background-size: 250% auto; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: textShimmer 4s linear infinite;
            word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
            will-change: transform, opacity, filter, clip-path; transform-origin: left top;
        }

        @keyframes textShimmer { 0% { background-position: -150% center; } 100% { background-position: 150% center; } }

<body>

    <div id="chat-widget"></div>

    <script>
        class KineticHUDOverlay {
            constructor() {
                this.container = document.getElementById('chat-widget');
                this.maxMessages = 2; 

                this.colors = [
                    '#ff0055', '#00ffff', '#ffaa00', '#b700ff', '#39ff14', 
                    '#ff00ff', '#0088ff', '#ff4500', '#f8f8ff', '#ff1493' 
                ];
                this.sequenceCounter = 1; 
            }

            getRandomColor() { return this.colors[Math.floor(Math.random() * this.colors.length)]; }

            addMessage(username, message, avatarUrl) {
                const wrapper = document.createElement('div');
                wrapper.className = 'msg-wrapper';

                const thread = document.createElement('div');
                thread.className = 'cyber-thread';

                const seqNum = this.sequenceCounter.toString().padStart(2, '0');
                
                const thIn = `thread-in-${seqNum}`; const thOut = `thread-out-${seqNum}`;
                const avIn = `avatar-in-${seqNum}`; const usIn = `user-in-${seqNum}`;
                const msIn = `msg-in-${seqNum}`; const lnIn = `line-in-${seqNum}`;

                this.sequenceCounter++;
                if (this.sequenceCounter > 20) this.sequenceCounter = 1;

                const accentColor = this.getRandomColor();
                thread.style.setProperty('--accent', accentColor);
                thread.classList.add(thIn);
                thread.dataset.animOut = thOut;

                thread.innerHTML = `
                    <div class="hud-line ${lnIn}"></div>
                    <div class="avatar-node ${avIn}">
                        <img src="${avatarUrl}" class="avatar" alt="User">
                    </div>
                    <div class="text-cluster">
                        <div class="username-glitch ${usIn}">${username}</div>
                        <div class="message-kinetic ${msIn}">${message}</div>
                    </div>
                `;

                wrapper.appendChild(thread);
                this.container.appendChild(wrapper);

                this.enforceLimit();
            }

            enforceLimit() {
                const messages = this.container.children;
                if (messages.length > this.maxMessages) {
                    const oldestWrapper = messages[0];

                    if (oldestWrapper.classList.contains('is-exiting')) return;
                    oldestWrapper.classList.add('is-exiting');

                    const thread = oldestWrapper.querySelector('.cyber-thread');
                    const animOut = thread.dataset.animOut;

                    thread.classList.add(animOut);

                    setTimeout(() => {
                        oldestWrapper.classList.add('collapsing');
                        setTimeout(() => {
                            if(oldestWrapper.parentNode) {
                                oldestWrapper.parentNode.removeChild(oldestWrapper);
                            }
                        }, 600); 
                    }, 500);
                }
            }
        }

        /**
         * =======================================================================
         * MASTER UNIFIED CHAT ENGINE (YOUTUBE + TWITCH + KICK)
         * Connects to all 3 platforms via WebSockets/Polling and pushes them
         * into a unified Master Queue to guarantee flawless dopamine animations.
         * =======================================================================
         */
        class MasterUnifiedChatEngine {
            constructor(hudEngine, handle) {
                this.hudEngine = hudEngine;
                this.handle = handle;
                
                // Master array that holds messages from ALL platforms
                this.masterQueue = [];
                
                // Controls deployment pacing so animations never skip
                this.isProcessingQueue = false;
                
                // Platform State
                this.ytNextPageToken = "";
                this.ytPolling = false;

                if (!this.handle) {
                    this.runDemoMode();
                } else {
                    this.fetchConfigAndStart();
                }

                // Start the master deployment loop
                setInterval(() => this.processQueue(), 2500);
            }

            // Fetches all usernames (YT, Twitch, Kick) from your Python backend
            async fetchConfigAndStart() {
                try {
                    const res = await fetch(`/api/streamer/${this.handle}?t=${new Date().getTime()}`);
                    const data = await res.json();
                    
                    if (data.authenticated) {
                        // 1. Start YouTube Polling
                        this.pollYouTube();
                        
                        // 2. Start Twitch WebSocket (if configured)
                        if (data.twitch_user) {
                            this.connectTwitch(data.twitch_user);
                        }

                        // 3. Start Kick WebSocket (if configured)
                        if (data.kick_user) {
                            this.connectKick(data.kick_user);
                        }
                    }
                } catch(e) {
                    console.error("Config fetch error:", e);
                }
            }

            // ==========================================
            // YOUTUBE POLLING
            // ==========================================
            async pollYouTube() {
                if(this.ytPolling) return;
                this.ytPolling = true;

                let delay = 5000; 
                try {
                    const url = `/api/streamer/${this.handle}/chat?pageToken=${this.ytNextPageToken}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    if (res.ok && !data.error) {
                        if (data.pollingIntervalMillis) delay = data.pollingIntervalMillis;
                        if (data.nextPageToken) this.ytNextPageToken = data.nextPageToken;

                        if (data.items && data.items.length > 0) {
                            data.items.forEach(item => {
                                this.masterQueue.push({
                                    username: item.authorDetails.displayName,
                                    message: item.snippet.displayMessage,
                                    avatar: item.authorDetails.profileImageUrl
                                });
                            });
                        }
                    } else {
                        delay = 10000;
                    }
                } catch (e) {
                    delay = 10000;
                }

                setTimeout(() => {
                    this.ytPolling = false;
                    this.pollYouTube();
                }, delay);
            }

            // ==========================================
            // TWITCH NATIVE WEBSOCKET (IRC)
            // ==========================================
            connectTwitch(channel) {
                const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
                
                ws.onopen = () => {
                    // Request tags to get display-name
                    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                    ws.send('NICK justinfan' + Math.floor(Math.random() * 100000));
                    ws.send(`JOIN #${channel.toLowerCase()}`);
                    console.log("[Twitch] Connected to", channel);
                };

                ws.onmessage = (event) => {
                    const lines = event.data.split('\r\n');
                    for (let line of lines) {
                        if (line === 'PING :tmi.twitch.tv') {
                            ws.send('PONG :tmi.twitch.tv');
                        } else if (line.includes('PRIVMSG')) {
                            const nameMatch = line.match(/display-name=([^;]+)/);
                            const msgMatch = line.match(/PRIVMSG #[^:]+:(.+)/);
                            if (nameMatch && msgMatch) {
                                const username = nameMatch[1];
                                const message = msgMatch[1];
                                // Use UI Avatars to generate a premium clean icon based on their name
                                const avatar = `https://ui-avatars.com/api/?name=${username}&background=random&color=fff&bold=true`;
                                
                                this.masterQueue.push({ username, message, avatar });
                            }
                        }
                    }
                };
            }

         // ==========================================
            // KICK WEBSOCKET (DIRECT ID + MULTI-KEY ROTATION)
            // ==========================================
            async connectKick(chatroomId) {
                // Because the Dashboard converted the username to an ID, we bypass Cloudflare APIs completely.
                if (!/^\d+$/.test(chatroomId)) {
                    console.error("[Kick] Invalid Chatroom ID. Open dashboard and sync again.");
                    return;
                }

                // Kick uses different Pusher keys globally. We loop through them instantly.
                const pusherKeys = ["eb1d5f283081a78b932c", "32cbd69e4b950bf97679", "1bb076ec966b931dd264"];
                let connected = false;

                for (let key of pusherKeys) {
                    if (connected) break;

                    await new Promise((resolve) => {
                        const ws = new WebSocket(`wss://ws-us2.pusher.com/app/${key}?protocol=7&client=js&version=7.4.0&flash=false`);
                        
                        // Fail quickly if key is dead
                        const timeout = setTimeout(() => { ws.close(); resolve(); }, 4000);

                        ws.onopen = () => {
                            clearTimeout(timeout);
                            ws.send(JSON.stringify({
                                event: "pusher:subscribe",
                                data: { auth: "", channel: `chatrooms.${chatroomId}.v2` }
                            }));
                            console.log(`[Kick] Connected securely to Room: ${chatroomId}`);
                            connected = true;
                            resolve();
                        };

                        ws.onmessage = (event) => {
                            const parsed = JSON.parse(event.data);
                            
                            if (parsed.event === "App\\Events\\ChatMessageEvent") {
                                const msgData = JSON.parse(parsed.data);
                                const username = msgData.sender.username;
                                const message = msgData.content;
                                
                                // Clean Typography Avatar
                                const avatar = msgData.sender.identity.profile_pic || `https://ui-avatars.com/api/?name=${username}&background=random&color=fff&bold=true`;
                                
                                this.masterQueue.push({ username, message, avatar });
                            }
                        };

                        ws.onerror = () => {
                            clearTimeout(timeout);
                            resolve(); // Try next key
                        };
                    });
                }
            }
            // ==========================================
            // MASTER QUEUE DEPLOYMENT
            // ==========================================
            processQueue() {
                // If there are messages waiting, release EXACTLY ONE every 2.5 seconds
                if (this.masterQueue.length > 0) {
                    const msg = this.masterQueue.shift();
                    this.hudEngine.addMessage(msg.username, msg.message, msg.avatar);
                }
            }

            runDemoMode() {
                const mockUsers = ["YT_Sniper", "Twitch_God", "Kick_Legend", "NeonViper", "VoidWalker"];
                const mockMsgs = [
                    "DEMO MODE: Add ?user=name to URL to connect all 3 platforms.",
                    "Twitch connection is active!",
                    "YouTube polling is active!",
                    "Kick websocket is active!",
                    "Messages from all 3 are funneled into this single queue seamlessly."
                ];

                const triggerRandomChat = () => {
                    const user = mockUsers[Math.floor(Math.random() * mockUsers.length)];
                    const msg = mockMsgs[Math.floor(Math.random() * mockMsgs.length)];
                    const avatar = `https://ui-avatars.com/api/?name=${user}&background=random&color=fff&bold=true`;
                    
                    this.masterQueue.push({ username: user, message: msg, avatar: avatar });
                    setTimeout(triggerRandomChat, Math.floor(Math.random() * 2000) + 1500);
                }
                setTimeout(triggerRandomChat, 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const hudEngine = new KineticHUDOverlay();
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('user') || '';
            
            // Starts the Unified Multi-Platform Engine
            new MasterUnifiedChatEngine(hudEngine, username);
        });
    </script>
</body>
