<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBD Zero-GPU Chat Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Oswald:wght@500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>
    <style>
        :root {
            /* Zero-GPU Compositor Easings */
            --lunge-ease: cubic-bezier(0.1, 0.9, 0.2, 1);
            --hook-drop: cubic-bezier(0.34, 1.56, 0.64, 1);
            
            /* Dead by Daylight UI Palette */
            --dbd-dark: #0a0a0c;
            --dbd-panel: #1a1a1f;
            --dbd-red: #c10000;
            --dbd-text: #e8e8e8;
            
            /* DBD Rank Colors */
            --rank-ash: #d4cfc9;
            --rank-bronze: #cd7f32;
            --rank-silver: #c0c0c0;
            --rank-gold: #ffd700;
            --rank-iri: #ff0055;
            --rank-pig: #ff0000; /* Entity/Pig Tier */

            /* Platform Colors */
            --plt-yt: #ff0000;
            --plt-tw: #9146ff;
            --plt-kk: #53fc18;
        }

        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: transparent; overflow: hidden;
            font-family: 'Rajdhani', sans-serif; -webkit-font-smoothing: antialiased;
        }

        #master-container {
            position: absolute; bottom: 30px; left: 30px;
            width: 550px; display: flex; flex-direction: column; gap: 20px;
        }

        /* ==========================================================================
           1. BLOODPOINT VIEWER HUD (Solid Vectors)
           ========================================================================== */
        #viewer-hud {
            display: flex; gap: 15px; z-index: 20;
        }

        .dbd-hud-card {
            display: none; align-items: center; justify-content: center; gap: 10px;
            padding: 8px 20px 8px 14px;
            background-color: var(--dbd-dark);
            border: 2px solid var(--dbd-panel);
            border-left: 6px solid var(--plt-color);
            /* Angled cuts similar to DBD score events */
            clip-path: polygon(0 0, 100% 0, 100% 80%, 90% 100%, 0 100%);
            transform-origin: left;
            animation: lungeIn 0.5s var(--lunge-ease) forwards;
            will-change: transform, opacity;
        }

        .plt-icon { width: 32px; height: 32px; color: var(--plt-color); }
        
        .v-count {
            font-family: 'Oswald', sans-serif; font-size: 2rem; font-weight: 700;
            color: var(--dbd-text); font-variant-numeric: tabular-nums;
            letter-spacing: 1px; will-change: transform;
        }

        .dbd-hud-card.dopamine-hit .v-count { animation: bpScore 0.5s var(--lunge-ease); }

        @keyframes lungeIn { 0% { opacity: 0; transform: translateX(-30px); } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes bpScore { 30% { transform: scale(1.3); color: var(--plt-color); } }

        /* ==========================================================================
           2. THE ENTITY CHAT ENGINE
           ========================================================================== */
        #chat-widget {
            position: relative; height: 400px; width: 100%;
            z-index: 10;
        }

        .msg-node {
            position: absolute; bottom: 0; left: 0; width: 100%;
            transition: transform 0.5s var(--lunge-ease), opacity 0.5s linear;
            will-change: transform, opacity;
            pointer-events: none;
        }

        /* Pure 2D Transform Stacking (ZERO GPU STRAIN) */
        .msg-pos-1 { transform: translateY(0) scale(1); opacity: 1; }
        .msg-pos-2 { transform: translateY(-100px) scale(0.95); opacity: 0.9; }
        .msg-pos-3 { transform: translateY(-190px) scale(0.9); opacity: 0.6; }
        .msg-pos-4 { transform: translateY(-270px) scale(0.85); opacity: 0.2; }
        .msg-dead  { transform: translateY(-350px) scale(0.8); opacity: 0; }

        .msg-inner {
            display: flex; align-items: center; gap: 15px; position: relative;
            will-change: transform, opacity;
        }

        /* The DBD Perk Diamond Avatar */
        .perk-diamond-wrapper {
            position: relative; width: 64px; height: 64px; flex-shrink: 0;
            /* Rotate wrapper 45deg to make diamond */
            transform: rotate(45deg);
            background-color: var(--dbd-dark);
            border: 3px solid var(--tier-color);
            overflow: hidden;
            z-index: 5;
        }
        .perk-diamond-wrapper img {
            width: 140%; height: 140%; object-fit: cover;
            /* Rotate image back so face is upright */
            transform: rotate(-45deg) translate(-15%, -15%);
            filter: grayscale(30%) contrast(120%);
        }

        /* Solid Vector Content Block */
        .content-block { 
            position: relative; display: flex; flex-direction: column; justify-content: center;
            padding: 10px 16px; min-height: 50px; flex-grow: 1;
            background-color: var(--dbd-panel);
            border: 2px solid rgba(255,255,255,0.05);
            border-left: 4px solid var(--tier-color);
            /* DBD UI Angled Corners */
            clip-path: polygon(0 0, 95% 0, 100% 20%, 100% 100%, 0 100%);
            overflow: hidden;
        }

        /* Subtle Scratch Mark Background Overlay (Pure CSS, 0 GPU) */
        .content-block::before {
            content: ''; position: absolute; top: 0; right: -20px; bottom: 0; width: 100px;
            background: repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,0,0,0.03) 10px, rgba(255,0,0,0.03) 20px);
            pointer-events: none; z-index: 0;
        }

        .user-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; z-index: 2; }
        .chat-plt-icon { width: 14px; height: 14px; color: var(--plt-color); }
        
        .username {
            font-family: 'Oswald', sans-serif; font-size: 0.9rem; font-weight: 700;
            letter-spacing: 1px; color: var(--tier-color); text-transform: uppercase;
        }

        .chat-text {
            font-family: 'Montserrat', sans-serif; font-size: 1.35rem; font-weight: 800;
            line-height: 1.2; letter-spacing: -0.01em; color: var(--dbd-text);
            word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
            z-index: 2;
        }

        /* ==========================================================================
           3. DBD RANKS (THE LIVE CHAT META-GAME)
           ========================================================================== */
        .grade-badge {
            font-family: 'Rajdhani', sans-serif; font-size: 0.65rem; font-weight: 900;
            color: #000; background: var(--tier-color);
            padding: 2px 6px; border-radius: 2px; letter-spacing: 1px;
            margin-left: auto; text-transform: uppercase;
        }

        .bp-score {
            font-family: 'Montserrat', sans-serif; font-size: 0.65rem; font-weight: 900;
            color: var(--dbd-red); margin-left: 6px;
        }

        /* Grade Dynamic Variable Injection (Handled in JS) */
        .tier-Ash { --tier-color: var(--rank-ash); }
        .tier-Bronze { --tier-color: var(--rank-bronze); }
        .tier-Silver { --tier-color: var(--rank-silver); }
        .tier-Gold { --tier-color: var(--rank-gold); }
        .tier-Iridescent { --tier-color: var(--rank-iri); }
        .tier-Pig { 
            --tier-color: var(--rank-pig); 
            background-color: #1a0000; 
        }
        .tier-Pig .chat-text { color: #fff; }
        .tier-Pig .grade-badge { color: #fff; border: 1px solid #fff; }

        /* ==========================================================================
           4. KILLER ENTRANCE ANIMATIONS (Pure Transform)
           ========================================================================== */
        /* Spawn 1: The Lunge (Slide Right) */
        .anim-lunge { animation: animLunge 0.5s var(--lunge-ease) both; }
        @keyframes animLunge { 0% { transform: translateX(-50px) scale(0.9); opacity: 0; } 100% { transform: translateX(0) scale(1); opacity: 1; } }

        /* Spawn 2: The Hook Drop (Slide Down) */
        .anim-hook { animation: animHook 0.6s var(--hook-drop) both; }
        @keyframes animHook { 0% { transform: translateY(-40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        /* Spawn 3: Entity Grasp (Scale Up) */
        .anim-grasp { animation: animGrasp 0.5s var(--hook-drop) both; }
        @keyframes animGrasp { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    </style>
</head>
<body>

    <div id="master-container">
        <!-- Solid Vector Viewer HUD -->
        <div id="viewer-hud">
            <div class="dbd-hud-card" id="node-yt" style="--plt-color: var(--plt-yt);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>
                <span class="v-count" id="count-yt">0</span>
            </div>
            <div class="dbd-hud-card" id="node-tw" style="--plt-color: var(--plt-tw);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
                <span class="v-count" id="count-tw">0</span>
            </div>
            <div class="dbd-hud-card" id="node-kk" style="--plt-color: var(--plt-kk);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2.333 1.1h3.914v9.845L16.234 1.1h5.433L10.354 11.378 22.38 22.9H16.63l-8.497-8.627v8.627H2.333V1.1Z"/></svg>
                <span class="v-count" id="count-kk">0</span>
            </div>
        </div>

        <!-- Zero GPU Chat Container -->
        <div id="chat-widget"></div>
    </div>

    <script>
        const SVGS = {
            yt: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>`,
            tw: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>`,
            kk: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2.333 1.1h3.914v9.845L16.234 1.1h5.433L10.354 11.378 22.38 22.9H16.63l-8.497-8.627v8.627H2.333V1.1Z"/></svg>`
        };

        // THE DBD SESSION RANK TRACKER (The Dopamine Meta-Game)
        class DBDRankTracker {
            constructor() {
                this.users = new Map();
            }

            trackMessage(username) {
                const count = (this.users.get(username) || 0) + 1;
                this.users.set(username, count);
                
                // Calculate Bloodpoints based on messages
                const bp = (count * 1000).toLocaleString();

                // Assign Grade based on chat frequency
                if (count >= 50) return { tier: 'Pig', name: "THE PIG'S DISCIPLE", bp: bp };
                if (count >= 30) return { tier: 'Iridescent', name: "IRIDESCENT I", bp: bp };
                if (count >= 15) return { tier: 'Gold', name: "GOLD I", bp: bp };
                if (count >= 7)  return { tier: 'Silver', name: "SILVER I", bp: bp };
                if (count >= 3)  return { tier: 'Bronze', name: "BRONZE I", bp: bp };
                return { tier: 'Ash', name: "ASH IV", bp: bp };
            }
        }

        class DBDZeroGPUChat {
            constructor() { 
                this.container = document.getElementById('chat-widget');
                this.rankTracker = new DBDRankTracker();
                this.animations = ['anim-lunge', 'anim-hook', 'anim-grasp'];
            }

            addMessage(username, message, avatarUrl, platform) {
                const node = document.createElement('div');
                node.className = 'msg-node msg-spawn';
                
                // Track user and get their live DBD Rank
                const rankData = this.rankTracker.trackMessage(username);
                const animStyle = this.animations[Math.floor(Math.random() * this.animations.length)];
                
                node.style.setProperty('--plt-color', `var(--plt-${platform})`);

                // Generate the HTML payload (Zero GPU, Pure Vector)
                node.innerHTML = `
                    <div class="msg-inner ${animStyle} tier-${rankData.tier}">
                        <div class="perk-diamond-wrapper">
                            <img src="${avatarUrl}" alt="">
                        </div>
                        <div class="content-block">
                            <div class="user-row">
                                ${SVGS[platform]} 
                                <span class="username">${username}</span>
                                <span class="bp-score">+${rankData.bp} BP</span>
                                <div class="grade-badge">${rankData.name}</div>
                            </div>
                            <div class="chat-text">${message}</div>
                        </div>
                    </div>
                `;

                this.container.appendChild(node);
                void node.offsetWidth; 
                this.updateZDepth();
            }

            updateZDepth() {
                const messages = Array.from(this.container.children).reverse();
                messages.forEach((msg, index) => {
                    msg.classList.remove('msg-spawn', 'msg-pos-1', 'msg-pos-2', 'msg-pos-3', 'msg-pos-4');
                    if (index === 0) msg.classList.add('msg-pos-1');
                    else if (index === 1) msg.classList.add('msg-pos-2');
                    else if (index === 2) msg.classList.add('msg-pos-3');
                    else if (index === 3) msg.classList.add('msg-pos-4');
                    else {
                        msg.classList.add('msg-dead');
                        // Fast cleanup to keep DOM light
                        setTimeout(() => { if(msg.parentNode) msg.parentNode.removeChild(msg); }, 500);
                    }
                });
            }
        }

        class ViewerEngine {
            constructor() { this.state = { yt: 0, tw: 0, kk: 0 }; }
            format(num) { return (num || 0).toLocaleString('en-US'); }

            triggerDopamine(nodeId) {
                const node = document.getElementById(nodeId);
                node.classList.remove('dopamine-hit');
                void node.offsetWidth; 
                node.classList.add('dopamine-hit');
            }

            update(platform, count) {
                const node = document.getElementById(`node-${platform}`);
                if (node.style.display !== 'flex') node.style.display = 'flex';
                if (count !== this.state[platform]) {
                    if (count > this.state[platform]) this.triggerDopamine(`node-${platform}`);
                    this.state[platform] = count;
                    document.getElementById(`count-${platform}`).innerText = this.format(count);
                }
            }

            async pollExternal(twitchUser, kickConfig) {
                if (twitchUser) {
                    try {
                        const res = await fetch(`https://decapi.me/twitch/viewercount/${twitchUser}`);
                        const count = parseInt(await res.text()) || 0;
                        this.update('tw', count);
                    } catch(e) {}
                }

                let kickUserSlug = kickConfig ? (kickConfig.includes("|||") ? kickConfig.split("|||")[0] : isNaN(kickConfig) ? kickConfig : "") : "";
                if (kickUserSlug) {
                    try {
                        const res = await fetch(`/api/kick_viewers/${kickUserSlug}?t=${new Date().getTime()}`);
                        const data = await res.json();
                        if (data && data.viewers !== undefined) this.update('kk', data.viewers);
                    } catch(e) {}
                }
            }
        }

        class MasterUnifiedEngine {
            constructor(chatEngine, viewerEngine, handle) {
                this.chatEngine = chatEngine; this.viewerEngine = viewerEngine;
                this.handle = handle; this.masterQueue = [];
                this.ytNextPageToken = ""; this.ytPolling = false;
                this.config = { tw: "", kk: "" };

                if (!this.handle) this.runDemoMode();
                else this.fetchConfigAndStart();

                setInterval(() => this.processQueue(), 2500); 
                setInterval(() => this.viewerEngine.pollExternal(this.config.tw, this.config.kk), 10000);
            }

            async fetchConfigAndStart() {
                try {
                    const res = await fetch(`/api/streamer/${this.handle}?t=${new Date().getTime()}`);
                    const data = await res.json();
                    
                    if (data.authenticated) {
                        this.config.tw = data.twitch_user; this.config.kk = data.kick_user;
                        this.pollYouTube();
                        this.viewerEngine.pollExternal(this.config.tw, this.config.kk);

                        if (this.config.tw) this.connectTwitch(this.config.tw);
                        if (this.config.kk) {
                            let kId = this.config.kk;
                            if (kId.includes("|||")) kId = kId.split("|||")[1];
                            if (kId) this.connectKick(kId); 
                        }
                    }
                } catch(e) {}
            }

            async pollYouTube() {
                if(this.ytPolling) return;
                this.ytPolling = true; let delay = 5000; 
                try {
                    const statRes = await fetch(`/api/streamer/${this.handle}?t=${new Date().getTime()}`);
                    const statData = await statRes.json();
                    if(statData.yt_viewers !== undefined) this.viewerEngine.update('yt', statData.yt_viewers);

                    const res = await fetch(`/api/streamer/${this.handle}/chat?pageToken=${this.ytNextPageToken}`);
                    const data = await res.json();
                    
                    if (res.ok && !data.error) {
                        if (data.pollingIntervalMillis) delay = data.pollingIntervalMillis;
                        if (data.nextPageToken) this.ytNextPageToken = data.nextPageToken;

                        if (data.items && data.items.length > 0) {
                            data.items.forEach(item => {
                                this.masterQueue.push({
                                    username: item.authorDetails.displayName,
                                    message: item.snippet.displayMessage,
                                    avatar: item.authorDetails.profileImageUrl,
                                    platform: 'yt'
                                });
                            });
                        }
                    } else { delay = 10000; }
                } catch (e) { delay = 10000; }
                setTimeout(() => { this.ytPolling = false; this.pollYouTube(); }, delay);
            }

            connectTwitch(channel) {
                const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
                ws.onopen = () => {
                    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                    ws.send(`NICK justinfan${Math.floor(Math.random() * 100000)}`);
                    ws.send(`JOIN #${channel.toLowerCase()}`);
                };
                ws.onmessage = (event) => {
                    const lines = event.data.split('\r\n');
                    for (let line of lines) {
                        if (line === 'PING :tmi.twitch.tv') ws.send('PONG :tmi.twitch.tv');
                        else if (line.includes('PRIVMSG')) {
                            const nameMatch = line.match(/display-name=([^;]+)/);
                            const msgMatch = line.match(/PRIVMSG #[^:]+:(.+)/);
                            if (nameMatch && msgMatch) {
                                const username = nameMatch[1];
                                const avatar = `https://ui-avatars.com/api/?name=${username}&background=random&color=fff&bold=true`;
                                this.masterQueue.push({ username, message: msgMatch[1], avatar, platform: 'tw' });
                            }
                        }
                    }
                };
            }

            connectKick(chatroomId) {
                if (!/^\d+$/.test(chatroomId)) return;
                const pusherKeys = ['eb1d5f283081a78b932c', '32cbd69e4b950bf97679', '1bb076ec966b931dd264'];
                let keyIndex = 0;

                const tryConnect = () => {
                    if (keyIndex >= pusherKeys.length) return;
                    const pusher = new Pusher(pusherKeys[keyIndex], { cluster: 'us2', forceTLS: true });

                    pusher.connection.bind('error', () => { pusher.disconnect(); keyIndex++; setTimeout(tryConnect, 1000); });

                    const channel = pusher.subscribe(`chatrooms.${chatroomId}.v2`);
                    channel.bind('App\\Events\\ChatMessageEvent', (data) => {
                        const username = data.sender.username;
                        const avatar = data.sender.identity.profile_pic || `https://ui-avatars.com/api/?name=${username}&background=random&color=fff&bold=true`;
                        this.masterQueue.push({ username, message: data.content, avatar, platform: 'kk' });
                    });
                };
                tryConnect();
            }

            processQueue() {
                if (this.masterQueue.length > 0) {
                    const msg = this.masterQueue.shift();
                    this.chatEngine.addMessage(msg.username, msg.message, msg.avatar, msg.platform);
                }
            }

            runDemoMode() {
                document.getElementById('node-yt').style.display = 'flex';
                document.getElementById('node-tw').style.display = 'flex';
                document.getElementById('node-kk').style.display = 'flex';
                
                setInterval(() => this.viewerEngine.update('yt', Math.floor(Math.random() * 50) + 1200), 5000);
                setInterval(() => {
                    this.viewerEngine.update('tw', Math.floor(Math.random() * 20) + 800);
                    this.viewerEngine.update('kk', Math.floor(Math.random() * 100) + 2100);
                }, 8000);

                const demoUsers = ["DwightMain", "Entity_Dweller", "HexRuin", "LoopGod"];
                
                const triggerRandomChat = () => {
                    const platforms = ['yt', 'tw', 'kk'];
                    const plt = platforms[Math.floor(Math.random() * platforms.length)];
                    const user = demoUsers[Math.floor(Math.random() * demoUsers.length)];
                    const avatar = `https://ui-avatars.com/api/?name=${user}&background=random&color=fff&bold=true`;
                    
                    this.masterQueue.push({ username: user, message: "Grinding for Iridescent! The perk diamond avatars look sick! \ud83d\udd25", avatar: avatar, platform: plt });
                    setTimeout(triggerRandomChat, Math.floor(Math.random() * 1200) + 800); // Fast pacing to demo ranks
                }
                setTimeout(triggerRandomChat, 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const chatEngine = new DBDZeroGPUChat();
            const viewerEngine = new ViewerEngine();
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('user') || '';
            
            new MasterUnifiedEngine(chatEngine, viewerEngine, username);
        });
    </script>
</body>
</html>
