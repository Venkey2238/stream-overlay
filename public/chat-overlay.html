<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Chat - Authentic DBD FX</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Syncopate:wght@700;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>

    <style>
        /* ================================================================
           AUTHENTIC DBD PREMIUM OVERLAY
           GAME-ACCURATE FX -> LIQUID REVEAL. ZERO OBS BLEEDING.
           ================================================================ */

        :root {
            --yt: #ff0033;
            --tw: #b05cff;
            --kk: #53fc18;
            
            /* Authentic DBD Colors */
            --blood: #e30022;
            --entity-black: #050508;
            --aura-pink: #ff1a55;
            --scratch-orange: #ff4500;
            --scratch-red: #ff0000;

            /* Deep Broadcast Rank Colors */
            --ash: #9ba1a8;
            --bronze: #e6883c;
            --silver: #d3e1ef;
            --gold: #ffcf33;
            --iridescent: #ff124d;

            --ease-fluid: cubic-bezier(0.25, 1, 0.2, 1);
            --ease-bounce: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-horror: cubic-bezier(0.7, 0, 0.1, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: transparent !important;
            font-family: 'Rajdhani', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ================================================================
           MASTER LAYOUT & SAFE-ZONE MATRIX
           ================================================================ */
        #master-container {
            position: absolute; left: 0px; bottom: 20px;
            width: 700px; /* Massive width guarantees FX never bleed */
            display: flex; flex-direction: column; gap: 20px;
            pointer-events: none;
        }

        #viewer-hud { display: flex; gap: 15px; z-index: 100; margin-left: 50px; }

        .hud-card {
            display: none; align-items: center; gap: 12px;
            padding: 10px 20px 10px 16px;
            background: rgba(15, 15, 20, 0.5);
            backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 8px 24px rgba(0,0,0,0.6);
            border-radius: 20px;
        }

        .plt-icon { width: 34px; height: 34px; color: var(--plt-color); filter: drop-shadow(0 0 8px var(--plt-color)); }
        .v-count { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 900; color: #fff; text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 1px 3px rgba(0,0,0,1); }

        /* ================================================================
           3D CHAT WORLD (STRICT CONTAINMENT)
           ================================================================ */
        #chat-widget {
            position: relative; width: 100%; height: 340px;
            perspective: 1200px; perspective-origin: bottom center;
            transform-style: preserve-3d;
            
            overflow: hidden; /* Absolute Clip */
            contain: layout paint size;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 100%);
        }

        .msg-node {
            position: absolute; left: 0; bottom: 15px;
            width: 100%; height: 115px;
            
            /* THE SAFE ZONE: Heavy padding traps the FX inside the box */
            padding-left: 60px; padding-right: 40px; 

            transform-origin: center bottom; transform-style: preserve-3d;
            transition: transform 0.8s var(--ease-fluid), opacity 0.8s var(--ease-fluid), filter 0.8s var(--ease-fluid);
            will-change: transform, opacity, filter;
        }

        /* Perfect 3D Depth Management */
        .msg-pos-1 { transform: translate3d(0, 0, 0) rotateX(0deg); opacity: 1; filter: blur(0); z-index: 10; }
        .msg-pos-2 { transform: translate3d(0, -135px, -60px) rotateX(8deg); opacity: 0.8; filter: blur(0.5px); z-index: 9; }
        .msg-dead { transform: translate3d(0, -280px, -150px) rotateX(15deg); opacity: 0; filter: blur(8px); pointer-events: none; }
        
        .msg-spawn { transform: translate3d(var(--spawn-x), var(--spawn-y), var(--spawn-z)) rotateX(var(--spawn-rotX)) rotateY(var(--spawn-rotY)) scale(var(--spawn-scale)); }

        /* ================================================================
           SEQUENTIAL ENGINE (FX -> CHAT)
           ================================================================ */
        .fx-layer {
            position: absolute; inset: 0; z-index: 20;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            animation: fxVanish 0.2s 1.2s forwards; /* FX dies exactly at 1.2s */
        }
        @keyframes fxVanish { to { opacity: 0; visibility: hidden; } }

        .msg-inner {
            display: flex; align-items: center; gap: 20px;
            width: 100%; height: 100%; position: relative;
            
            /* Hidden until the FX finishes */
            opacity: 0; transform: scale(0.7) translateY(30px); filter: blur(15px);
            
            /* Snaps into reality exactly as the FX peaks (1.0s) */
            animation: chatMaterialize 0.7s var(--ease-bounce) 1.0s forwards;
        }
        @keyframes chatMaterialize { to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }

        /* ================================================================
           THE 5 AUTHENTIC DBD FX ENGINES
           ================================================================ */

        /* --- 1. THE GREAT SKILL CHECK --- */
        .fx-skillcheck { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; }
        .sk-track {
            position: absolute; inset: 0; border-radius: 50%;
            background: conic-gradient(from -90deg, transparent 0deg, transparent 200deg, var(--blood) 200deg, var(--blood) 235deg, #fff 235deg, #fff 255deg, transparent 255deg);
            mask: radial-gradient(transparent 60%, black 61%); -webkit-mask: radial-gradient(transparent 60%, black 61%);
            opacity: 0; animation: skPop 0.3s var(--ease-bounce) forwards;
        }
        .sk-needle {
            position: absolute; width: 4px; height: 50%; top: 0; background: #fff;
            transform-origin: bottom center; transform: rotate(0deg);
            box-shadow: 0 0 10px #fff, 0 0 20px #fff; opacity: 0;
            animation: skSweep 0.5s 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .sk-flash {
            position: absolute; inset: -50px; border-radius: 50%; background: #fff;
            filter: blur(20px); opacity: 0;
            animation: skDing 0.6s 0.8s forwards;
        }
        @keyframes skPop { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes skSweep { 0% { opacity: 1; transform: rotate(0deg); } 100% { opacity: 1; transform: rotate(245deg); } }
        @keyframes skDing { 0% { opacity: 1; transform: scale(0.2); } 100% { opacity: 0; transform: scale(1.5); } }


        /* --- 2. SURVIVOR SCRATCH MARKS --- */
        .fx-scratch { position: relative; width: 150px; height: 100%; transform: rotate(15deg); }
        .sc {
            position: absolute; background: var(--scratch-orange);
            border-radius: 50% 50% 50% 50% / 10% 10% 90% 90%;
            box-shadow: 0 0 15px var(--scratch-orange), 0 0 30px var(--scratch-red);
            transform-origin: bottom center; transform: scaleY(0); opacity: 0; filter: brightness(1.5);
        }
        .sc-1 { left: 20%; width: 8px; top: 10%; animation: burnIn 0.3s 0.1s forwards, scratchFlicker 0.1s 0.4s infinite alternate, burnOut 0.4s 1s forwards; }
        .sc-2 { left: 50%; width: 12px; top: -10%; height: 120%; animation: burnIn 0.3s 0.2s forwards, scratchFlicker 0.1s 0.5s infinite alternate, burnOut 0.4s 1s forwards; }
        .sc-3 { left: 80%; width: 8px; top: 15%; animation: burnIn 0.3s 0.3s forwards, scratchFlicker 0.1s 0.6s infinite alternate, burnOut 0.4s 1s forwards; }
        @keyframes burnIn { 0% { transform: scaleY(0); opacity: 0; } 100% { transform: scaleY(1); opacity: 0.9; height: 100px; } }
        @keyframes scratchFlicker { 0% { filter: brightness(1.2) blur(1px); } 100% { filter: brightness(1.8) blur(3px); } }
        @keyframes burnOut { to { opacity: 0; filter: blur(10px); transform: scaleY(1.2); } }


        /* --- 3. THE ENTITY'S GRASP --- */
        .fx-entity { position: absolute; inset: -40px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
        .ent-claw { width: 150px; height: 60px; background: var(--entity-black); box-shadow: 0 0 40px var(--blood); filter: drop-shadow(0 0 10px rgba(227,0,34,0.6)); }
        .ent-top { 
            clip-path: polygon(50% 100%, 30% 60%, 0% 80%, 20% 30%, 10% 0%, 50% 20%, 90% 0%, 80% 30%, 100% 80%, 70% 60%);
            transform: translateY(-100%) scale(1.5); animation: entStab 0.4s var(--ease-horror) 0.1s forwards, entRip 0.4s var(--ease-horror) 0.9s forwards;
        }
        .ent-bot { 
            clip-path: polygon(50% 0%, 70% 40%, 100% 20%, 80% 70%, 90% 100%, 50% 80%, 10% 100%, 20% 70%, 0% 20%, 30% 40%);
            transform: translateY(100%) scale(1.5); animation: entStab 0.4s var(--ease-horror) 0.2s forwards, entRip 0.4s var(--ease-horror) 0.9s forwards;
        }
        @keyframes entStab { to { transform: translateY(0) scale(1); } }
        @keyframes entRip { to { transform: translateY(var(--dir)) scale(1.2); opacity: 0; } }


        /* --- 4. THE BLOODWEB --- */
        .fx-bloodweb { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .bw-node { position: absolute; border-radius: 50%; background: var(--blood); box-shadow: 0 0 20px var(--blood), inset 0 0 10px #000; transform: scale(0); }
        .bw-n-center { width: 24px; height: 24px; animation: bwPulse 0.4s var(--ease-bounce) 0.1s forwards; }
        .bw-n1 { width: 14px; height: 14px; top: 10%; left: 30%; animation: bwPulse 0.3s var(--ease-bounce) 0.4s forwards; }
        .bw-n2 { width: 18px; height: 18px; top: 80%; left: 40%; animation: bwPulse 0.3s var(--ease-bounce) 0.5s forwards; }
        .bw-n3 { width: 16px; height: 16px; top: 40%; left: 80%; animation: bwPulse 0.3s var(--ease-bounce) 0.6s forwards; }
        .bw-line { position: absolute; background: var(--blood); height: 3px; box-shadow: 0 0 10px var(--blood); transform-origin: left center; transform: scaleX(0); }
        .bw-l1 { top: 50%; left: 50%; width: 60px; transform: rotate(-135deg); animation: bwVein 0.3s 0.2s forwards; }
        .bw-l2 { top: 50%; left: 50%; width: 50px; transform: rotate(110deg); animation: bwVein 0.3s 0.3s forwards; }
        .bw-l3 { top: 50%; left: 50%; width: 70px; transform: rotate(-10deg); animation: bwVein 0.3s 0.4s forwards; }
        @keyframes bwPulse { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; filter: brightness(2); } 100% { transform: scale(1); opacity: 0; } }
        @keyframes bwVein { to { transform: rotate(var(--rot)) scaleX(1); opacity: 0; } }


        /* --- 5. THE KILLER'S AURA --- */
        .fx-aura { position: absolute; width: 100%; height: 100%; overflow: hidden; border-radius: 22px; }
        .au-scan { position: absolute; top: -10%; bottom: -10%; left: -50px; width: 25px; background: #fff; box-shadow: 0 0 60px 30px var(--aura-pink); transform: rotate(15deg); animation: auSweep 0.8s 0.1s forwards; }
        .au-silhouette { position: absolute; inset: 10px; background: var(--aura-pink); filter: blur(25px); opacity: 0; mix-blend-mode: screen; animation: auGlow 1.2s 0.3s forwards; }
        @keyframes auSweep { to { left: 150%; } }
        @keyframes auGlow { 0% { opacity: 0; } 30% { opacity: 0.8; transform: scale(1.1); } 100% { opacity: 0; transform: scale(0.9); } }

        /* ================================================================
           LIVING LIQUID AVATARS
           ================================================================ */
        .hologram-avatar { position: relative; width: 85px; height: 85px; flex-shrink: 0; z-index: 5; display: flex; align-items: center; justify-content: center; margin-right: 5px; }
        .avatar-ring {
            position: absolute; inset: -4px;
            background: conic-gradient(from 0deg, transparent 0%, var(--rank-color) 40%, #fff 50%, var(--rank-color) 60%, transparent 100%);
            animation: liquidMorph var(--ava-morph-speed) ease-in-out infinite alternate var(--ava-delay), spin var(--ava-spin-speed) linear infinite;
            opacity: 0.9; filter: drop-shadow(0 0 12px var(--rank-color));
        }
        .avatar-img { position: relative; width: 100%; height: 100%; object-fit: cover; animation: liquidMorph var(--ava-morph-speed) ease-in-out infinite alternate-reverse var(--ava-delay); filter: contrast(1.1) grayscale(0.05) saturate(1.2); z-index: 2; }
        @keyframes liquidMorph { 0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; } 33% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; } 66% { border-radius: 50% 50% 60% 40% / 60% 40% 70% 30%; } 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Dopamine BP Popup (Pops AFTER Chat appears) */
        .bp-popup {
            position: absolute; top: -10px; left: 50%; transform: translate(-50%, 0);
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.3rem; color: var(--blood);
            text-shadow: 0 2px 8px rgba(0,0,0,1), 0 0 2px rgba(0,0,0,1); white-space: nowrap; z-index: 50; pointer-events: none;
            opacity: 0; animation: bpFloat 1.8s var(--ease-fluid) 1.2s forwards;
        }
        @keyframes bpFloat { 0% { opacity: 0; transform: translate(-50%, 5px) scale(0.6); } 20% { opacity: 1; transform: translate(-50%, -15px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -45px) scale(0.9); } }

        /* ================================================================
           LIQUID GLASSMORPHISM CHAT BLOCK
           ================================================================ */
        .content-block {
            position: relative; flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center;
            padding: 12px 20px 16px 25px;
            background: linear-gradient(135deg, rgba(20,20,25,0.6) 0%, rgba(10,10,15,0.9) 100%);
            backdrop-filter: blur(24px) saturate(200%); -webkit-backdrop-filter: blur(24px) saturate(200%);
            border-radius: 22px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), inset 4px 0 12px rgba(var(--rank-rgb), 0.4), 0 12px 30px rgba(0,0,0,0.7);
            overflow: hidden; z-index: 2;
        }

        .gen-progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(0,0,0,0.5); border-radius: 0 0 22px 22px; overflow: hidden; }
        .gen-fill { height: 100%; background: var(--rank-color); box-shadow: 0 0 12px var(--rank-color); transition: width 1s var(--ease-fluid); position: relative; }
        .gen-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent); animation: energyFlow 2s linear infinite; }
        @keyframes energyFlow { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* ================================================================
           CINEMATIC TYPOGRAPHY
           ================================================================ */
        .user-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; z-index: 2; position: relative; }
        .chat-plt-icon { width: 16px; height: 16px; color: var(--plt-color); }
        .username {
            font-family: 'Syncopate', sans-serif; font-size: 0.85rem; font-weight: 900; color: var(--rank-color); text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,1); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .chat-text {
            position: relative; z-index: 2; font-family: 'Montserrat', sans-serif; font-size: 1.55rem; font-weight: 800; line-height: 1.2; color: #fff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.95), 0 1px 3px rgba(0,0,0,1), 0 8px 24px rgba(0,0,0,0.6);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-wrap: break-word;
        }

        .badge-container { position: absolute; right: 14px; top: 12px; display: flex; align-items: center; gap: 8px; z-index: 3; }
        .tier-badge {
            background: rgba(0,0,0,0.6); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 2px 8px rgba(0,0,0,0.5);
            padding: 4px 12px; border-radius: 12px; color: #fff; font-family: 'Syncopate', sans-serif; font-size: 0.6rem; font-weight: 900;
        }

        /* ROLE COLORS */
        .role-1 { --rank-color: var(--ash); --rank-rgb: 155, 161, 168; }
        .role-2 { --rank-color: #b0b5bb; --rank-rgb: 176, 181, 187; }
        .role-3 { --rank-color: var(--bronze); --rank-rgb: 230, 136, 60; }
        .role-4 { --rank-color: #f09852; --rank-rgb: 240, 152, 82; }
        .role-5 { --rank-color: var(--silver); --rank-rgb: 211, 225, 239; }
        .role-6 { --rank-color: #e5f0f9; --rank-rgb: 229, 240, 249; }
        .role-7 { --rank-color: var(--gold); --rank-rgb: 255, 207, 51; }
        .role-8 { --rank-color: #ffda66; --rank-rgb: 255, 218, 102; }
        .role-9 { --rank-color: var(--iridescent); --rank-rgb: 255, 18, 77; }
        .role-10 { --rank-color: #ff3366; --rank-rgb: 255, 51, 102; }

    </style>
</head>
<body>

    <div id="master-container">
        <!-- HUD -->
        <div id="viewer-hud">
            <div class="hud-card" id="node-yt" style="--plt-color: var(--yt);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12zM10,15.464V8.536L16,12z"/></svg>
                <span class="v-count" id="count-yt">0</span>
            </div>
            <div class="hud-card" id="node-tw" style="--plt-color: var(--tw);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
                <span class="v-count" id="count-tw">0</span>
            </div>
            <div class="hud-card" id="node-kk" style="--plt-color: var(--kk);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2.333 1.1h3.914v9.845L16.234 1.1h5.433L10.354 11.378 22.38 22.9H16.63l-8.497-8.627v8.627H2.333V1.1Z"/></svg>
                <span class="v-count" id="count-kk">0</span>
            </div>
        </div>

        <!-- 3D CAGE WIDGET -->
        <div id="chat-widget"></div>
    </div>

    <script>
        const SVGS = {
            yt: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12zM10,15.464V8.536L16,12z"/></svg>`,
            tw: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>`,
            kk: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2.333 1.1h3.914v9.845L16.234 1.1h5.433L10.354 11.378 22.38 22.9H16.63l-8.497-8.627v8.627H2.333V1.1Z"/></svg>`
        };

        const DBD_ROLES = [
            { name: 'ASH IV', limit: 2, cls: 'role-1' }, { name: 'ASH I', limit: 4, cls: 'role-2' },
            { name: 'BRONZE IV', limit: 7, cls: 'role-3' }, { name: 'BRONZE I', limit: 12, cls: 'role-4' },
            { name: 'SILVER IV', limit: 18, cls: 'role-5' }, { name: 'SILVER I', limit: 25, cls: 'role-6' },
            { name: 'GOLD IV', limit: 35, cls: 'role-7' }, { name: 'GOLD I', limit: 50, cls: 'role-8' },
            { name: 'IRIDESCENT IV', limit: 75, cls: 'role-9' }, { name: 'IRIDESCENT I', limit: 9999, cls: 'role-10' }
        ];

        const ANIMATIONS = ['eff-scratch', 'eff-skillcheck', 'eff-bloodweb', 'eff-aura', 'eff-entity'];

        class HolographicChatEngine {
            constructor() {
                this.container = document.getElementById('chat-widget');
                this.viewerProfiles = new Map();
            }

            getRoleData(username) {
                const key = String(username).trim().toLowerCase();
                
                if (!this.viewerProfiles.has(key)) {
                    this.viewerProfiles.set(key, { 
                        msgs: 0, 
                        idx: 0,
                        fx: ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)]
                    });
                }
                
                const p = this.viewerProfiles.get(key); p.msgs++;
                let nIdx = 0;
                for (let i = 0; i < DBD_ROLES.length; i++) { if (p.msgs >= DBD_ROLES[i].limit) nIdx = i + 1; else break; }
                if(nIdx >= DBD_ROLES.length) nIdx = DBD_ROLES.length - 1;
                
                const currLimit = nIdx === 0 ? 0 : DBD_ROLES[nIdx-1].limit;
                const progress = ((p.msgs - currLimit) / (DBD_ROLES[nIdx].limit - currLimit)) * 100;
                
                return { role: DBD_ROLES[nIdx], progress: Math.min(progress, 100), fx: p.fx };
            }

            getFxHTML(fxType) {
                switch(fxType) {
                    case 'eff-scratch':
                        return `<div class="fx-scratch"><div class="sc sc-1"></div><div class="sc sc-2"></div><div class="sc sc-3"></div></div>`;
                    case 'eff-skillcheck':
                        return `<div class="fx-skillcheck"><div class="sk-track"></div><div class="sk-needle"></div><div class="sk-flash"></div></div>`;
                    case 'eff-bloodweb':
                        return `<div class="fx-bloodweb"><div class="bw-line bw-l1" style="--rot:-135deg;"></div><div class="bw-line bw-l2" style="--rot:110deg;"></div><div class="bw-line bw-l3" style="--rot:-10deg;"></div><div class="bw-node bw-n-center"></div><div class="bw-node bw-n1"></div><div class="bw-node bw-n2"></div><div class="bw-node bw-n3"></div></div>`;
                    case 'eff-aura':
                        return `<div class="fx-aura"><div class="au-scan"></div><div class="au-silhouette"></div></div>`;
                    case 'eff-entity':
                        return `<div class="fx-entity"><div class="ent-claw ent-top" style="--dir:-100%;"></div><div class="ent-claw ent-bot" style="--dir:100%;"></div></div>`;
                }
                return '';
            }

            escape(val) { return String(val ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

            addMessage(username, message, avatarUrl, platform) {
                const roleData = this.getRoleData(username);
                const safeName = this.escape(username);
                const safeMsg = this.escape(message);
                const safeAva = this.escape(avatarUrl);
                const bpEarned = Math.floor(Math.random() * 200) + 50;
                
                const node = document.createElement('div');
                
                node.style.setProperty('--spawn-x', `${(Math.random() * 40 - 20)}px`);
                node.style.setProperty('--spawn-y', `${(Math.random() * 30 + 10)}px`);
                node.style.setProperty('--spawn-z', `${(Math.random() * 60 + 60)}px`);
                node.style.setProperty('--spawn-rotX', `${(Math.random() * 10 - 5)}deg`);
                node.style.setProperty('--spawn-rotY', `${(Math.random() * 10 - 5)}deg`);
                node.style.setProperty('--spawn-scale', `${(Math.random() * 0.1 + 0.9)}`);
                
                node.style.setProperty('--ava-morph-speed', `${(Math.random() * 4 + 3).toFixed(1)}s`); 
                node.style.setProperty('--ava-spin-speed', `${(Math.random() * 8 + 4).toFixed(1)}s`);  
                node.style.setProperty('--ava-delay', `-${(Math.random() * 5).toFixed(1)}s`);
                
                node.style.setProperty('--plt-color', `var(--${platform})`);
                node.className = `msg-node msg-spawn ${roleData.role.cls}`;

                node.innerHTML = `
                    <div class="fx-layer">
                        ${this.getFxHTML(roleData.fx)}
                    </div>
                    
                    <div class="msg-inner">
                        <div class="hologram-avatar">
                            <div class="avatar-ring"></div>
                            <img src="${safeAva}" class="avatar-img" alt="">
                            <div class="bp-popup">+${bpEarned} BP</div>
                        </div>
                        
                        <div class="content-block">
                            <div class="badge-container">
                                <div class="tier-badge">${roleData.role.name}</div>
                            </div>
                            <div class="user-row">
                                ${SVGS[platform]}
                                <span class="username">${safeName}</span>
                            </div>
                            <div class="chat-text">${safeMsg}</div>
                            
                            <div class="gen-progress-container">
                                <div class="gen-fill" style="width: ${roleData.progress}%"></div>
                            </div>
                        </div>
                    </div>
                `;

                this.container.prepend(node);
                void node.offsetWidth; 
                this.updateZDepth();
            }

            updateZDepth() {
                const messages = Array.from(this.container.children);
                messages.forEach((msg, i) => {
                    msg.classList.remove('msg-spawn', 'msg-pos-1', 'msg-pos-2', 'msg-dead');
                    if (i === 0) msg.classList.add('msg-pos-1'); 
                    else if (i === 1) msg.classList.add('msg-pos-2'); 
                    else {
                        msg.classList.add('msg-dead'); 
                        setTimeout(() => { if(msg.parentNode) msg.remove(); }, 800);
                    }
                });
            }
        }

        class ViewerEngine {
            constructor() { this.state = { yt: 0, tw: 0, kk: 0 }; }
            update(plt, count) {
                const node = document.getElementById(`node-${plt}`);
                if (node.style.display !== 'flex') node.style.display = 'flex';
                if (count !== this.state[plt]) { this.state[plt] = count; document.getElementById(`count-${plt}`).innerText = count.toLocaleString('en-US'); }
            }
            async pollExternal(tw, kk) {
                if (tw) { try { const r = await fetch(`https://decapi.me/twitch/viewercount/${tw}`); this.update('tw', parseInt(await r.text())||0); } catch(e){} }
                if (kk) { let k = kk.includes("|||") ? kk.split("|||")[0] : (isNaN(kk) ? kk : ""); if(k) { try { const r = await fetch(`/api/kick_viewers/${k}`); const d = await r.json(); if(d && d.viewers!==undefined) this.update('kk', d.viewers); } catch(e){} } }
            }
        }

        class MasterUnifiedEngine {
            constructor(cEng, vEng, handle) {
                this.c = cEng; this.v = vEng; this.h = handle;
                this.q = []; 
                this.ytNextPageToken = "";
                this.ytPolling = false;
                this.config = { tw: "", kk: "" };
                
                if (!this.h) this.demo(); else this.start();
                
                setInterval(() => this.process(), 3500); 
            }

            // QUOTA PROTECTION: Strictly 30 seconds for viewers/likes (Guaranteed 10+ hours safe)
            startStatsLoop() {
                const fetchStats = async () => {
                    try {
                        const r = await fetch(`/api/streamer/${this.h}?t=${new Date().getTime()}`);
                        const d = await r.json();
                        if (d.yt_viewers !== undefined) this.v.update('yt', d.yt_viewers);
                    } catch(e) {}
                    this.v.pollExternal(this.config.tw, this.config.kk);
                };
                fetchStats(); 
                setInterval(fetchStats, 30000); 
            }

            async start() {
                try {
                    const r = await fetch(`/api/streamer/${this.h}`); const d = await r.json();
                    if (d.authenticated) {
                        this.config.tw = d.twitch_user; this.config.kk = d.kick_user;
                        
                        this.startStatsLoop();
                        this.pollYouTube();
                        
                        if (this.config.tw) this.connTw(this.config.tw.replace(/^[@#]/, '').trim());
                        if (this.config.kk) { 
                            let kid = this.config.kk.includes("|||") ? this.config.kk.split("|||")[1] : this.config.kk; 
                            if(kid) this.connKk(kid); 
                        }
                    }
                } catch(e) {}
            }

            async pollYouTube() {
                if (this.ytPolling) return;
                this.ytPolling = true;
                
                // QUOTA PROTECTION: Chat minimum 6 seconds
                let delay = 6000; 
                
                try {
                    const res = await fetch(`/api/streamer/${this.h}/chat?pageToken=${this.ytNextPageToken || ""}`);
                    const data = await res.json();
                    
                    if (res.ok && !data.error) {
                        if (data.pollingIntervalMillis) delay = Math.max(data.pollingIntervalMillis, 6000);
                        if (data.nextPageToken) this.ytNextPageToken = data.nextPageToken;
                        
                        if (data.items && data.items.length > 0) {
                            data.items.forEach(item => {
                                this.q.push({
                                    u: item.authorDetails.displayName,
                                    m: item.snippet.displayMessage,
                                    a: item.authorDetails.profileImageUrl,
                                    p: 'yt'
                                });
                            });
                        }
                    } else if (data.pollingIntervalMillis) {
                        delay = Math.max(data.pollingIntervalMillis, 6000);
                    }
                } catch(e) {
                    delay = 10000;
                }
                
                setTimeout(() => { this.ytPolling = false; this.pollYouTube(); }, delay);
            }

            connTw(ch) {
                const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
                ws.onopen = () => { 
                    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands'); 
                    ws.send(`NICK justinfan${Math.floor(Math.random() * 100000)}`); 
                    ws.send(`JOIN #${ch.toLowerCase()}`); 
                };
                ws.onmessage = (e) => {
                    const lines = e.data.split('\r\n');
                    for (let l of lines) {
                        if (l.startsWith('PING')) ws.send('PONG :tmi.twitch.tv');
                        else if (l.includes('PRIVMSG')) {
                            let nm = l.match(/display-name=([^;]*)/);
                            let username = (nm && nm[1]) ? nm[1] : null;
                            if (!username) {
                                let un = l.match(/:([^!]+)!/);
                                if (un) username = un[1];
                            }
                            const m = l.match(/PRIVMSG #[^:]+:(.+)/);
                            if(username && m) {
                                this.q.push({ 
                                    u: username, 
                                    m: m[1].trim(), 
                                    p: 'tw', 
                                    a: `https://ui-avatars.com/api/?name=${username}&background=random&color=fff&bold=true` 
                                });
                            }
                        }
                    }
                };
            }

            async connKk(username) {
                let chatroomId = username.trim();
                if (!/^\d+$/.test(chatroomId)) {
                    try {
                        const res = await fetch(`https://api.codetabs.com/v1/proxy?quest=https://kick.com/api/v1/channels/${chatroomId}`);
                        const data = await res.json();
                        if (data && data.chatroom && data.chatroom.id) {
                            chatroomId = data.chatroom.id.toString();
                        } else return;
                    } catch(e) { return; }
                }

                const pusherKeys = ['eb1d5f283081a78b932c', '32cbd69e4b950bf97679', '1bb076ec966b931dd264'];
                let keyIndex = 0;
                
                const tryConnect = () => {
                    if (keyIndex >= pusherKeys.length) return;
                    const p = new Pusher(pusherKeys[keyIndex], { cluster: 'us2', forceTLS: true });
                    
                    p.connection.bind('error', () => {
                        p.disconnect();
                        keyIndex++;
                        setTimeout(tryConnect, 1000);
                    });
                    
                    p.subscribe(`chatrooms.${chatroomId}.v2`).bind('App\\Events\\ChatMessageEvent', (d) => {
                        if (d && d.sender) {
                            this.q.push({ 
                                u: d.sender.username, 
                                m: d.content, 
                                p: 'kk', 
                                a: d.sender.identity.profile_pic || `https://ui-avatars.com/api/?name=${d.sender.username}&background=random&color=fff&bold=true` 
                            });
                        }
                    });
                };
                tryConnect();
            }

            process() { if (this.q.length > 0) { const msg = this.q.shift(); this.c.addMessage(msg.u, msg.m, msg.a, msg.p); } }
            
            demo() {
                ['yt','tw','kk'].forEach(p => document.getElementById(`node-${p}`).style.display = 'flex');
                setInterval(() => {
                    this.v.update('yt', Math.floor(Math.random()*50)+1200);
                    this.v.update('tw', Math.floor(Math.random()*20)+400);
                    this.v.update('kk', Math.floor(Math.random()*100)+2000);
                }, 5000);
                
                const bot = () => {
                    const plts = ['yt','tw','kk']; const plt = plts[Math.floor(Math.random()*3)];
                    const users = ['Entity_Prey', 'Meg_Main', 'Hex_Ruin', 'Boon_User', 'Nancy_AI'];
                    const msgs = ["The Entity demands a sacrifice.", "Gen rushing again?", "Looping shack all day.", "Dropped a god pallet!", "Hit a great skill check!!"];
                    
                    const u = users[Math.floor(Math.random()*users.length)]; const m = msgs[Math.floor(Math.random()*msgs.length)];
                    this.q.push({ u: u, m: m, a: `https://ui-avatars.com/api/?name=${u}&background=random&color=fff&bold=true`, p: plt });
                    
                    setTimeout(bot, Math.random()*2500 + 1500);
                }; setTimeout(bot, 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new MasterUnifiedEngine(new HolographicChatEngine(), new ViewerEngine(), new URLSearchParams(window.location.search).get('user') || '');
        });
    </script>
</body>
</html>
