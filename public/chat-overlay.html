<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-GPU Performance Chat Matrix</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Syncopate:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>
    <style>
        :root {
            /* Math-based easing costs 0 GPU but looks ultra-premium */
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --snap: cubic-bezier(0.16, 1, 0.3, 1);
            
            /* High-Contrast Brand Colors */
            --plt-yt: #ff0000;
            --plt-tw: #a970ff;
            --plt-kk: #53fc18;
            
            /* Rarity Colors (Solid, no glows) */
            --tier-rare: #00e5ff;
            --tier-epic: #ff00ea;
            --tier-mythic: #ffd700;
            --tier-god: #ffffff;
        }

        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: transparent; overflow: hidden;
            font-family: 'Rajdhani', sans-serif; -webkit-font-smoothing: antialiased;
        }

        #master-container {
            position: absolute; bottom: 40px; left: 40px;
            width: 550px; display: flex; flex-direction: column; gap: 30px;
        }

        /* ==========================================================================
           1. ZERO-GPU VIEWER HUD (Flat Vector Style)
           ========================================================================== */
        #viewer-hud {
            display: flex; gap: 20px; z-index: 20;
        }

        .hud-card {
            display: none; align-items: center; justify-content: center; gap: 14px;
            padding: 10px 24px 10px 16px; border-radius: 8px;
            /* Solid color with transparency - NO BACKDROP BLUR */
            background: rgba(10, 12, 18, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-bottom: 4px solid var(--plt-color);
            transform-origin: bottom left;
            animation: popIn 0.6s var(--spring) forwards;
            /* Pre-allocate rendering layer for 0 stutter */
            will-change: transform, opacity;
        }

        .plt-icon {
            width: 42px; height: 42px; color: var(--plt-color);
            will-change: transform;
        }

        .v-count {
            font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 900;
            color: #fff; font-variant-numeric: tabular-nums;
            will-change: transform, color;
        }

        /* Performance-Friendly Update Pulse (Only transforms) */
        .hud-card.dopamine-hit .plt-icon { animation: pulseIcon 0.5s var(--spring); }
        .hud-card.dopamine-hit .v-count { animation: pulseText 0.5s var(--spring); }

        @keyframes popIn { 0% { opacity: 0; transform: translateY(20px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes pulseIcon { 50% { transform: scale(1.25); } }
        @keyframes pulseText { 50% { transform: scale(1.15); color: var(--plt-color); } }

        /* ==========================================================================
           2. ZERO-GPU MATRIX CHAT ENGINE
           ========================================================================== */
        #chat-widget {
            position: relative; height: 380px; width: 100%;
            z-index: 10;
        }

        .msg-node {
            position: absolute; bottom: 0; left: 0; width: 100%;
            transition: transform 0.6s var(--spring), opacity 0.6s var(--snap);
            transform-origin: left bottom;
            will-change: transform, opacity;
            pointer-events: none;
        }

        /* 2D Faux-Depth Stacking (Replaces heavy 3D rendering) */
        .msg-pos-1 { transform: translateY(0) scale(1); opacity: 1; }
        .msg-pos-2 { transform: translateY(-110px) scale(0.95); opacity: 0.9; }
        .msg-pos-3 { transform: translateY(-210px) scale(0.9); opacity: 0.6; }
        .msg-pos-4 { transform: translateY(-300px) scale(0.85); opacity: 0.2; }
        .msg-dead  { transform: translateY(-400px) scale(0.8); opacity: 0; }

        .msg-inner {
            display: flex; align-items: flex-start; gap: 16px; position: relative;
            will-change: transform, opacity;
        }

        /* Solid Vector Content Block */
        .content-block { 
            position: relative; display: flex; flex-direction: column; justify-content: center;
            padding: 12px 20px; min-height: 50px; flex-grow: 1;
            background: rgba(12, 14, 20, 0.95);
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
            border-left: 6px solid var(--plt-color);
            overflow: hidden;
        }

        /* Avatar Box */
        .avatar-box { position: relative; width: 56px; height: 56px; flex-shrink: 0; border-radius: 6px; overflow: hidden; border: 2px solid var(--plt-color); }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }

        .user-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .chat-plt-icon { width: 16px; height: 16px; color: var(--plt-color); }
        
        .username {
            font-family: 'Syncopate', sans-serif; font-size: 0.75rem; font-weight: 900;
            letter-spacing: 0.15em; color: var(--plt-color); text-transform: uppercase;
        }

        .chat-text {
            font-family: 'Montserrat', sans-serif; font-size: 1.4rem; font-weight: 900;
            line-height: 1.2; letter-spacing: -0.01em; color: #ffffff;
            word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
            will-change: transform, opacity;
        }

        /* ==========================================================================
           3. RARITY TIERS (Color & Border Mapping Only)
           ========================================================================== */
        .tier-badge {
            position: absolute; right: 10px; top: 10px;
            font-family: 'Syncopate', sans-serif; font-size: 0.55rem; font-weight: 900; letter-spacing: 0.2em;
            padding: 4px 8px; border-radius: 4px; color: #000; display: none; text-transform: uppercase;
        }

        .tier-COMMON .content-block { border-left-color: var(--plt-color); }
        
        .tier-RARE .content-block { border-left-color: var(--tier-rare); }
        .tier-RARE .username { color: var(--tier-rare); }
        .tier-RARE .tier-badge { display: block; background: var(--tier-rare); }

        .tier-EPIC .content-block { border: 2px solid var(--tier-epic); border-left: 6px solid var(--tier-epic); }
        .tier-EPIC .username { color: var(--tier-epic); }
        .tier-EPIC .tier-badge { display: block; background: var(--tier-epic); }

        .tier-MYTHIC .content-block { border: 3px solid var(--tier-mythic); border-left: 8px solid var(--tier-mythic); background: rgba(30, 25, 5, 0.95); }
        .tier-MYTHIC .username { color: var(--tier-mythic); font-size: 0.85rem; }
        .tier-MYTHIC .chat-text { color: var(--tier-mythic); }
        .tier-MYTHIC .tier-badge { display: block; background: var(--tier-mythic); }

        .tier-GOD .content-block { border: 4px solid var(--tier-god); background: #ffffff; }
        .tier-GOD .username { color: #000; }
        .tier-GOD .chat-text { color: #000; font-weight: 900; }
        .tier-GOD .tier-badge { display: block; background: #000; color: #fff; }

        /* ==========================================================================
           4. GPU-ACCELERATED ANIMATIONS (Only Transform/Opacity)
           ========================================================================== */
        
        /* Box Animations (5 variants) */
        .bA-1 { animation: bA1 0.6s var(--spring) both; } /* Slide Right */
        .bA-2 { animation: bA2 0.6s var(--spring) both; } /* Slide Up */
        .bA-3 { animation: bA3 0.5s var(--snap) both; }   /* Scale Pop */
        .bA-4 { animation: bA4 0.6s var(--spring) both; } /* Slide Down */
        .bA-5 { animation: bA5 0.5s var(--snap) both; }   /* Simple Fade */

        @keyframes bA1 { 0% { transform: translateX(-50px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes bA2 { 0% { transform: translateY(40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes bA3 { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes bA4 { 0% { transform: translateY(-40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes bA5 { 0% { opacity: 0; } 100% { opacity: 1; } }

        /* Text Animations (5 variants) */
        .tA-1 .chat-text { animation: tA1 0.5s 0.1s var(--spring) both; } /* Slide Right */
        .tA-2 .chat-text { animation: tA2 0.5s 0.1s var(--spring) both; } /* Slide Up */
        .tA-3 .chat-text { animation: tA3 0.4s 0.1s var(--snap) both; }   /* Zoom In */
        .tA-4 .chat-text { animation: tA4 0.5s 0.1s var(--spring) both; } /* Expand Y */
        .tA-5 .chat-text { animation: tA5 0.4s 0.1s var(--snap) both; }   /* Pure Fade */

        @keyframes tA1 { 0% { transform: translateX(-15px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes tA2 { 0% { transform: translateY(15px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes tA3 { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes tA4 { 0% { transform: scaleY(0.5); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }
        @keyframes tA5 { 0% { opacity: 0; } 100% { opacity: 1; } }

    </style>
</head>
<body>

    <div id="master-container">
        <!-- Massive Stable Viewer HUD (Vector) -->
        <div id="viewer-hud">
            <div class="hud-card" id="node-yt" style="--plt-color: var(--plt-yt);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>
                <span class="v-count" id="count-yt">0</span>
            </div>
            <div class="hud-card" id="node-tw" style="--plt-color: var(--plt-tw);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
                <span class="v-count" id="count-tw">0</span>
            </div>
            <div class="hud-card" id="node-kk" style="--plt-color: var(--plt-kk);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2.333 1.1h3.914v9.845L16.234 1.1h5.433L10.354 11.378 22.38 22.9H16.63l-8.497-8.627v8.627H2.333V1.1Z"/></svg>
                <span class="v-count" id="count-kk">0</span>
            </div>
        </div>

        <!-- GPU-Friendly Matrix Chat -->
        <div id="chat-widget"></div>
    </div>

    <script>
        const SVGS = {
            yt: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>`,
            tw: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>`,
            kk: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2.333 1.1h3.914v9.845L16.234 1.1h5.433L10.354 11.378 22.38 22.9H16.63l-8.497-8.627v8.627H2.333V1.1Z"/></svg>`
        };

        class ZeroGPUChatEngine {
            constructor() { this.container = document.getElementById('chat-widget'); }

            calculateMatrix() {
                const roll = Math.random();
                let tier = 'COMMON';
                if (roll > 0.99) tier = 'GOD';         
                else if (roll > 0.94) tier = 'MYTHIC'; 
                else if (roll > 0.79) tier = 'EPIC';   
                else if (roll > 0.49) tier = 'RARE';   

                const boxAnim = Math.floor(Math.random() * 5) + 1;
                const textAnim = Math.floor(Math.random() * 5) + 1;

                return { tier, boxAnim, textAnim };
            }

            addMessage(username, message, avatarUrl, platform) {
                const node = document.createElement('div');
                node.className = 'msg-node msg-spawn';
                
                const matrix = this.calculateMatrix();
                node.style.setProperty('--plt-color', `var(--plt-${platform})`);

                node.innerHTML = `
                    <div class="msg-inner tier-${matrix.tier} bA-${matrix.boxAnim} tA-${matrix.textAnim}">
                        <div class="avatar-box"><img src="${avatarUrl}" class="avatar-img" alt=""></div>
                        <div class="content-block">
                            <div class="tier-badge">${matrix.tier}</div>
                            <div class="user-row">${SVGS[platform]} <span class="username">${username}</span></div>
                            <div class="chat-text">${message}</div>
                        </div>
                    </div>
                `;

                this.container.appendChild(node);
                void node.offsetWidth; 
                this.updateZDepth();
            }

            updateZDepth() {
                const messages = Array.from(this.container.children).reverse();
                messages.forEach((msg, index) => {
                    msg.classList.remove('msg-spawn', 'msg-pos-1', 'msg-pos-2', 'msg-pos-3', 'msg-pos-4');
                    if (index === 0) msg.classList.add('msg-pos-1');
                    else if (index === 1) msg.classList.add('msg-pos-2');
                    else if (index === 2) msg.classList.add('msg-pos-3');
                    else if (index === 3) msg.classList.add('msg-pos-4');
                    else {
                        msg.classList.add('msg-dead');
                        setTimeout(() => { if(msg.parentNode) msg.parentNode.removeChild(msg); }, 600);
                    }
                });
            }
        }

        class ViewerEngine {
            constructor() { this.state = { yt: 0, tw: 0, kk: 0 }; }
            format(num) { return (num || 0).toLocaleString('en-US'); }

            triggerDopamine(nodeId) {
                const node = document.getElementById(nodeId);
                node.classList.remove('dopamine-hit');
                void node.offsetWidth; 
                node.classList.add('dopamine-hit');
            }

            update(platform, count) {
                const node = document.getElementById(`node-${platform}`);
                if (node.style.display !== 'flex') node.style.display = 'flex';
                if (count !== this.state[platform]) {
                    if (count > this.state[platform]) this.triggerDopamine(`node-${platform}`);
                    this.state[platform] = count;
                    document.getElementById(`count-${platform}`).innerText = this.format(count);
                }
            }

            async pollExternal(twitchUser, kickConfig) {
                if (twitchUser) {
                    try {
                        const res = await fetch(`https://decapi.me/twitch/viewercount/${twitchUser}`);
                        const count = parseInt(await res.text()) || 0;
                        this.update('tw', count);
                    } catch(e) {}
                }

                let kickUserSlug = kickConfig ? (kickConfig.includes("|||") ? kickConfig.split("|||")[0] : isNaN(kickConfig) ? kickConfig : "") : "";
                if (kickUserSlug) {
                    try {
                        const res = await fetch(`/api/kick_viewers/${kickUserSlug}?t=${new Date().getTime()}`);
                        const data = await res.json();
                        if (data && data.viewers !== undefined) this.update('kk', data.viewers);
                    } catch(e) {}
                }
            }
        }

        class MasterUnifiedEngine {
            constructor(chatEngine, viewerEngine, handle) {
                this.chatEngine = chatEngine; this.viewerEngine = viewerEngine;
                this.handle = handle; this.masterQueue = [];
                this.ytNextPageToken = ""; this.ytPolling = false;
                this.config = { tw: "", kk: "" };

                if (!this.handle) this.runDemoMode();
                else this.fetchConfigAndStart();

                setInterval(() => this.processQueue(), 2500); 
                setInterval(() => this.viewerEngine.pollExternal(this.config.tw, this.config.kk), 10000);
            }

            async fetchConfigAndStart() {
                try {
                    const res = await fetch(`/api/streamer/${this.handle}?t=${new Date().getTime()}`);
                    const data = await res.json();
                    
                    if (data.authenticated) {
                        this.config.tw = data.twitch_user; this.config.kk = data.kick_user;
                        this.pollYouTube();
                        this.viewerEngine.pollExternal(this.config.tw, this.config.kk);

                        if (this.config.tw) this.connectTwitch(this.config.tw);
                        if (this.config.kk) {
                            let kId = this.config.kk;
                            if (kId.includes("|||")) kId = kId.split("|||")[1];
                            if (kId) this.connectKick(kId); 
                        }
                    }
                } catch(e) {}
            }

            async pollYouTube() {
                if(this.ytPolling) return;
                this.ytPolling = true; let delay = 5000; 
                try {
                    const statRes = await fetch(`/api/streamer/${this.handle}?t=${new Date().getTime()}`);
                    const statData = await statRes.json();
                    if(statData.yt_viewers !== undefined) this.viewerEngine.update('yt', statData.yt_viewers);

                    const res = await fetch(`/api/streamer/${this.handle}/chat?pageToken=${this.ytNextPageToken}`);
                    const data = await res.json();
                    
                    if (res.ok && !data.error) {
                        if (data.pollingIntervalMillis) delay = data.pollingIntervalMillis;
                        if (data.nextPageToken) this.ytNextPageToken = data.nextPageToken;

                        if (data.items && data.items.length > 0) {
                            data.items.forEach(item => {
                                this.masterQueue.push({
                                    username: item.authorDetails.displayName,
                                    message: item.snippet.displayMessage,
                                    avatar: item.authorDetails.profileImageUrl,
                                    platform: 'yt'
                                });
                            });
                        }
                    } else { delay = 10000; }
                } catch (e) { delay = 10000; }
                setTimeout(() => { this.ytPolling = false; this.pollYouTube(); }, delay);
            }

            connectTwitch(channel) {
                const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
                ws.onopen = () => {
                    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                    ws.send(`NICK justinfan${Math.floor(Math.random() * 100000)}`);
                    ws.send(`JOIN #${channel.toLowerCase()}`);
                };
                ws.onmessage = (event) => {
                    const lines = event.data.split('\r\n');
                    for (let line of lines) {
                        if (line === 'PING :tmi.twitch.tv') ws.send('PONG :tmi.twitch.tv');
                        else if (line.includes('PRIVMSG')) {
                            const nameMatch = line.match(/display-name=([^;]+)/);
                            const msgMatch = line.match(/PRIVMSG #[^:]+:(.+)/);
                            if (nameMatch && msgMatch) {
                                const username = nameMatch[1];
                                const avatar = `https://ui-avatars.com/api/?name=${username}&background=random&color=fff&bold=true`;
                                this.masterQueue.push({ username, message: msgMatch[1], avatar, platform: 'tw' });
                            }
                        }
                    }
                };
            }

            connectKick(chatroomId) {
                if (!/^\d+$/.test(chatroomId)) return;
                const pusherKeys = ['eb1d5f283081a78b932c', '32cbd69e4b950bf97679', '1bb076ec966b931dd264'];
                let keyIndex = 0;

                const tryConnect = () => {
                    if (keyIndex >= pusherKeys.length) return;
                    const pusher = new Pusher(pusherKeys[keyIndex], { cluster: 'us2', forceTLS: true });

                    pusher.connection.bind('error', () => { pusher.disconnect(); keyIndex++; setTimeout(tryConnect, 1000); });

                    const channel = pusher.subscribe(`chatrooms.${chatroomId}.v2`);
                    channel.bind('App\\Events\\ChatMessageEvent', (data) => {
                        const username = data.sender.username;
                        const avatar = data.sender.identity.profile_pic || `https://ui-avatars.com/api/?name=${username}&background=random&color=fff&bold=true`;
                        this.masterQueue.push({ username, message: data.content, avatar, platform: 'kk' });
                    });
                };
                tryConnect();
            }

            processQueue() {
                if (this.masterQueue.length > 0) {
                    const msg = this.masterQueue.shift();
                    this.chatEngine.addMessage(msg.username, msg.message, msg.avatar, msg.platform);
                }
            }

            runDemoMode() {
                document.getElementById('node-yt').style.display = 'flex';
                document.getElementById('node-tw').style.display = 'flex';
                document.getElementById('node-kk').style.display = 'flex';
                
                setInterval(() => this.viewerEngine.update('yt', Math.floor(Math.random() * 50) + 1200), 5000);
                setInterval(() => {
                    this.viewerEngine.update('tw', Math.floor(Math.random() * 20) + 800);
                    this.viewerEngine.update('kk', Math.floor(Math.random() * 100) + 2100);
                }, 8000);

                const triggerRandomChat = () => {
                    const platforms = ['yt', 'tw', 'kk'];
                    const plt = platforms[Math.floor(Math.random() * platforms.length)];
                    const user = "Performance_User";
                    const avatar = `https://ui-avatars.com/api/?name=${user}&background=random&color=fff&bold=true`;
                    
                    this.masterQueue.push({ username: user, message: "0% GPU load. Clean flat vectors. 125 combinations. This is built for multi-streaming. \ud83d\udd25", avatar: avatar, platform: plt });
                    setTimeout(triggerRandomChat, Math.floor(Math.random() * 1500) + 1200);
                }
                setTimeout(triggerRandomChat, 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const chatEngine = new ZeroGPUChatEngine();
            const viewerEngine = new ViewerEngine();
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('user') || '';
            
            new MasterUnifiedEngine(chatEngine, viewerEngine, username);
        });
    </script>
</body>
</html>
