<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBD Gamified Chat - Zero GPU Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Syncopate:wght@700;900&family=Rajdhani:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>
    <style>
        :root {
            /* Zero GPU Performance Easings */
            --ease-fast: cubic-bezier(0.16, 1, 0.3, 1);
            
            /* Core Platforms */
            --plt-yt: #ff0000;
            --plt-tw: #a970ff;
            --plt-kk: #53fc18;
            
            /* DBD Rank Colors (Solid, high contrast, ZERO glows/blurs) */
            --rank-ash: #8c8b8b;
            --rank-bronze: #cd7f32;
            --rank-silver: #e0e0e0;
            --rank-gold: #ffbc00;
            --rank-iri: #ff0033;
            --rank-entity: #000000;
        }

        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: transparent; overflow: hidden;
            font-family: 'Rajdhani', sans-serif; -webkit-font-smoothing: antialiased;
        }

        #master-container {
            position: absolute; bottom: 40px; left: 40px;
            width: 550px; display: flex; flex-direction: column; gap: 15px;
        }

        /* ==========================================================================
           1. ZERO-GPU FLAT VIEWER HUD
           ========================================================================== */
        #viewer-hud { display: flex; gap: 12px; z-index: 20; }

        .hud-card {
            display: none; align-items: center; justify-content: center; gap: 10px;
            padding: 8px 18px; border-radius: 4px;
            background: #111111; /* Solid, opaque background. No blur. */
            border: 2px solid #222;
            border-bottom: 4px solid var(--plt-color);
            transition: transform 0.1s var(--ease-fast), border-color 0.1s;
            will-change: transform;
        }

        .plt-icon { width: 28px; height: 28px; color: var(--plt-color); }
        .v-count { 
            font-family: 'Montserrat', sans-serif; font-size: 1.8rem; font-weight: 900; 
            color: #fff; font-variant-numeric: tabular-nums; 
        }
        
        /* Instant pop instead of heavy continuous animation */
        .hud-card.data-flash { transform: scale(1.08); border-color: var(--plt-color); }

        /* ==========================================================================
           2. ZERO-GPU FLAT CHAT WIDGET (MAX 2 MESSAGES)
           ========================================================================== */
        #chat-widget { 
            position: relative; height: 260px; width: 100%; z-index: 10; 
            display: flex; flex-direction: column; justify-content: flex-end; gap: 12px;
        }

        .msg-node {
            width: 100%;
            /* Only animate transform and opacity. Hardware composite only. */
            transition: transform 0.3s var(--ease-fast), opacity 0.3s var(--ease-fast);
            transform-origin: left bottom; will-change: transform, opacity;
        }

        /* Initial spawn state */
        .msg-spawn { transform: translateY(20px); opacity: 0; }
        
        /* Active states */
        .msg-active { transform: translateY(0); opacity: 1; }
        
        /* Solid Vector Content Block */
        .content-block { 
            display: flex; align-items: flex-start; gap: 14px;
            padding: 14px 18px; background: var(--bg-color, #161616);
            border-radius: 6px; border: 2px solid #2a2a2a;
            border-left: 10px solid var(--rank-color);
            overflow: hidden;
        }

        /* Avatar Box matching rank */
        .avatar-box {
            position: relative; width: 54px; height: 54px; flex-shrink: 0;
            border: 3px solid var(--rank-color); background: #000; border-radius: 4px;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }

        /* Text Layout */
        .text-col { display: flex; flex-direction: column; flex-grow: 1; justify-content: center; }
        
        /* The Meta Header (Icons, Names, Ranks, Bloodpoints) */
        .meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .chat-plt-icon { width: 14px; height: 14px; color: var(--plt-color); }
        
        .username {
            font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 900;
            color: var(--plt-color); text-transform: uppercase;
        }

        /* DBD GAMIFICATION BADGES */
        .rank-badge {
            font-family: 'Syncopate', sans-serif; font-size: 0.6rem; font-weight: 900;
            letter-spacing: 0.1em; padding: 2px 6px; border-radius: 3px;
            background: var(--rank-color); color: #000; text-transform: uppercase;
        }

        .bp-counter {
            font-family: 'Rajdhani', sans-serif; font-size: 0.95rem; font-weight: 900;
            color: #ff4d4d; margin-left: auto; display: flex; align-items: center; gap: 4px;
            background: #2a0000; padding: 2px 6px; border-radius: 3px; border: 1px solid #550000;
        }

        /* The actual chat message - Massive for scale-down readability */
        .chat-text {
            font-family: 'Montserrat', sans-serif; font-size: 1.45rem; font-weight: 800;
            line-height: 1.2; color: #ffffff;
            word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* ==========================================================================
           3. DBD RANK OVERRIDES (No Glows, High Contrast Colors)
           ========================================================================== */
        
        /* THE ENTITY (Top Chatter Override) */
        .is-entity .content-block { background: #000000; border-color: #ff0000; border-left-width: 14px; }
        .is-entity .rank-badge { background: #ff0000; color: #fff; font-size: 0.7rem; }
        .is-entity .bp-counter { background: #ff0000; color: #fff; border-color: #ff0000; }
        .is-entity .username { color: #ff0000; }
        .is-entity .chat-text { color: #ffcccc; }
        .is-entity .avatar-box { border-color: #ff0000; border-radius: 50%; }

    </style>
</head>
<body>

    <div id="master-container">
        <!-- Solid High-Contrast Viewer HUD -->
        <div id="viewer-hud">
            <div class="hud-card" id="node-yt" style="--plt-color: var(--plt-yt);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>
                <span class="v-count" id="count-yt">0</span>
            </div>
            <div class="hud-card" id="node-tw" style="--plt-color: var(--plt-tw);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
                <span class="v-count" id="count-tw">0</span>
            </div>
            <div class="hud-card" id="node-kk" style="--plt-color: var(--plt-kk);">
                <svg class="plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2.333 1.1h3.914v9.845L16.234 1.1h5.433L10.354 11.378 22.38 22.9H16.63l-8.497-8.627v8.627H2.333V1.1Z"/></svg>
                <span class="v-count" id="count-kk">0</span>
            </div>
        </div>

        <!-- Zero-GPU Gamified Chat Container -->
        <div id="chat-widget"></div>
    </div>

    <script>
        const SVGS = {
            yt: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>`,
            tw: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>`,
            kk: `<svg class="chat-plt-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2.333 1.1h3.914v9.845L16.234 1.1h5.433L10.354 11.378 22.38 22.9H16.63l-8.497-8.627v8.627H2.333V1.1Z"/></svg>`
        };

        // ==========================================
        // THE DBD GAMIFICATION ALGORITHM
        // ==========================================
        class DBDGamificationEngine {
            constructor() {
                this.users = {}; 
                this.entityUser = null; 
                
                // Decay Bloodpoints every 10 seconds to force continuous chatting
                setInterval(() => this.decayBloodpoints(), 10000);
            }

            getRankData(bp) {
                if (bp >= 30000) return { name: "Iridescent", color: "var(--rank-iri)", bg: "#1f0006" };
                if (bp >= 15000) return { name: "Gold", color: "var(--rank-gold)", bg: "#1f1800" };
                if (bp >= 7000)  return { name: "Silver", color: "var(--rank-silver)", bg: "#1c1c1c" };
                if (bp >= 2000)  return { name: "Bronze", color: "var(--rank-bronze)", bg: "#1c1109" };
                return { name: "Ash", color: "var(--rank-ash)", bg: "#141414" };
            }

            processChat(username) {
                const now = Date.now();
                
                if (!this.users[username]) {
                    this.users[username] = { bp: 0, lastActive: now };
                }

                const user = this.users[username];
                
                // Add base BP
                let bpGain = 1200;
                
                // Combo Bonus: If they chat again within 15 seconds, multiply earnings
                if (now - user.lastActive < 15000) {
                    bpGain = 2000;
                }
                
                user.bp += bpGain;
                user.lastActive = now;

                // Evaluate "The Entity" (Top Chatter)
                let highestBP = 0;
                let newEntity = null;
                for (const [name, data] of Object.entries(this.users)) {
                    if (data.bp > highestBP) {
                        highestBP = data.bp;
                        newEntity = name;
                    }
                }
                
                // Must have at least Silver Rank to become The Entity
                if (highestBP >= 7000) {
                    this.entityUser = newEntity;
                } else {
                    this.entityUser = null;
                }

                return {
                    bp: user.bp,
                    rank: this.getRankData(user.bp),
                    isEntity: (username === this.entityUser)
                };
            }

            decayBloodpoints() {
                const now = Date.now();
                for (const [username, user] of Object.entries(this.users)) {
                    // Decay triggers if silent for 15 seconds
                    if (now - user.lastActive > 15000) {
                        user.bp = Math.floor(user.bp * 0.85); // Lose 15% to create urgency
                        if (user.bp < 0) user.bp = 0;
                    }
                }
            }
        }

        class ZeroGPUChatEngine {
            constructor(gamification) { 
                this.container = document.getElementById('chat-widget');
                this.game = gamification;
            }

            addMessage(username, message, avatarUrl, platform) {
                const node = document.createElement('div');
                
                const stats = this.game.processChat(username);
                const pltVar = `var(--plt-${platform})`;
                let entityClass = stats.isEntity ? "is-entity" : "";
                let rankLabel = stats.isEntity ? "THE ENTITY" : stats.rank.name;

                node.className = `msg-node msg-spawn ${entityClass}`;
                node.style.setProperty('--plt-color', pltVar);
                node.style.setProperty('--rank-color', stats.rank.color);
                node.style.setProperty('--bg-color', stats.rank.bg);

                // Blood drop emoji ensures thematic feel without needing image assets
                node.innerHTML = `
                    <div class="content-block">
                        <div class="avatar-box"><img src="${avatarUrl}" class="avatar-img" alt=""></div>
                        <div class="text-col">
                            <div class="meta-row">
                                ${SVGS[platform]}
                                <span class="username">${username}</span>
                                <span class="rank-badge">${rankLabel}</span>
                                <span class="bp-counter">🩸 ${stats.bp.toLocaleString()}</span>
                            </div>
                            <div class="chat-text">${message}</div>
                        </div>
                    </div>
                `;

                this.container.appendChild(node);
                
                // Allow DOM to register spawn state, then transition to active
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        node.classList.remove('msg-spawn');
                        node.classList.add('msg-active');
                        this.enforceLimit();
                    });
                });
            }

            enforceLimit() {
                // STRICT 2 MESSAGE LIMIT for zero clutter
                const messages = Array.from(this.container.children);
                if (messages.length > 2) {
                    const oldest = messages[0];
                    oldest.style.opacity = '0';
                    oldest.style.transform = 'translateY(-20px)';
                    setTimeout(() => {
                        if (oldest.parentNode) oldest.parentNode.removeChild(oldest);
                    }, 300); // Matches CSS transition duration
                }
            }
        }

        class ViewerEngine {
            constructor() { this.state = { yt: 0, tw: 0, kk: 0 }; }
            format(num) { return (num || 0).toLocaleString('en-US'); }

            triggerFlash(nodeId) {
                const node = document.getElementById(nodeId);
                node.classList.remove('data-flash');
                void node.offsetWidth; 
                node.classList.add('data-flash');
                setTimeout(() => node.classList.remove('data-flash'), 150); // Fast, sharp pop
            }

            update(platform, count) {
                const node = document.getElementById(`node-${platform}`);
                if (node.style.display !== 'flex') node.style.display = 'flex';
                if (count !== this.state[platform]) {
                    if (count > this.state[platform]) this.triggerFlash(`node-${platform}`);
                    this.state[platform] = count;
                    document.getElementById(`count-${platform}`).innerText = this.format(count);
                }
            }

            async pollExternal(twitchUser, kickConfig) {
                if (twitchUser) {
                    try {
                        const res = await fetch(`https://decapi.me/twitch/viewercount/${twitchUser}`);
                        const count = parseInt(await res.text()) || 0;
                        this.update('tw', count);
                    } catch(e) {}
                }

                let kickUserSlug = kickConfig ? (kickConfig.includes("|||") ? kickConfig.split("|||")[0] : isNaN(kickConfig) ? kickConfig : "") : "";
                if (kickUserSlug) {
                    try {
                        const res = await fetch(`/api/kick_viewers/${kickUserSlug}?t=${new Date().getTime()}`);
                        const data = await res.json();
                        if (data && data.viewers !== undefined) this.update('kk', data.viewers);
                    } catch(e) {}
                }
            }
        }

        class MasterUnifiedEngine {
            constructor(chatEngine, viewerEngine, handle) {
                this.chatEngine = chatEngine; this.viewerEngine = viewerEngine;
                this.handle = handle; this.masterQueue = [];
                this.ytNextPageToken = ""; this.ytPolling = false;
                this.config = { tw: "", kk: "" };

                if (!this.handle) this.runDemoMode();
                else this.fetchConfigAndStart();

                setInterval(() => this.processQueue(), 1500); // Fast pacing to support 2-message limit
                setInterval(() => this.viewerEngine.pollExternal(this.config.tw, this.config.kk), 10000);
            }

            async fetchConfigAndStart() {
                try {
                    const res = await fetch(`/api/streamer/${this.handle}?t=${new Date().getTime()}`);
                    const data = await res.json();
                    
                    if (data.authenticated) {
                        this.config.tw = data.twitch_user; this.config.kk = data.kick_user;
                        this.pollYouTube();
                        this.viewerEngine.pollExternal(this.config.tw, this.config.kk);

                        if (this.config.tw) this.connectTwitch(this.config.tw);
                        if (this.config.kk) {
                            let kId = this.config.kk;
                            if (kId.includes("|||")) kId = kId.split("|||")[1];
                            if (kId) this.connectKick(kId); 
                        }
                    }
                } catch(e) {}
            }

            async pollYouTube() {
                if(this.ytPolling) return;
                this.ytPolling = true; let delay = 5000; 
                try {
                    const statRes = await fetch(`/api/streamer/${this.handle}?t=${new Date().getTime()}`);
                    const statData = await statRes.json();
                    if(statData.yt_viewers !== undefined) this.viewerEngine.update('yt', statData.yt_viewers);

                    const res = await fetch(`/api/streamer/${this.handle}/chat?pageToken=${this.ytNextPageToken}`);
                    const data = await res.json();
                    
                    if (res.ok && !data.error) {
                        if (data.pollingIntervalMillis) delay = data.pollingIntervalMillis;
                        if (data.nextPageToken) this.ytNextPageToken = data.nextPageToken;

                        if (data.items && data.items.length > 0) {
                            data.items.forEach(item => {
                                this.masterQueue.push({
                                    username: item.authorDetails.displayName,
                                    message: item.snippet.displayMessage,
                                    avatar: item.authorDetails.profileImageUrl,
                                    platform: 'yt'
                                });
                            });
                        }
                    } else { delay = 10000; }
                } catch (e) { delay = 10000; }
                setTimeout(() => { this.ytPolling = false; this.pollYouTube(); }, delay);
            }

            connectTwitch(channel) {
                const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
                ws.onopen = () => {
                    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                    ws.send(`NICK justinfan${Math.floor(Math.random() * 100000)}`);
                    ws.send(`JOIN #${channel.toLowerCase()}`);
                };
                ws.onmessage = (event) => {
                    const lines = event.data.split('\r\n');
                    for (let line of lines) {
                        if (line === 'PING :tmi.twitch.tv') ws.send('PONG :tmi.twitch.tv');
                        else if (line.includes('PRIVMSG')) {
                            const nameMatch = line.match(/display-name=([^;]+)/);
                            const msgMatch = line.match(/PRIVMSG #[^:]+:(.+)/);
                            if (nameMatch && msgMatch) {
                                const username = nameMatch[1];
                                const avatar = `https://ui-avatars.com/api/?name=${username}&background=random&color=fff&bold=true`;
                                this.masterQueue.push({ username, message: msgMatch[1], avatar, platform: 'tw' });
                            }
                        }
                    }
                };
            }

            connectKick(chatroomId) {
                if (!/^\d+$/.test(chatroomId)) return;
                const pusherKeys = ['eb1d5f283081a78b932c', '32cbd69e4b950bf97679', '1bb076ec966b931dd264'];
                let keyIndex = 0;

                const tryConnect = () => {
                    if (keyIndex >= pusherKeys.length) return;
                    const pusher = new Pusher(pusherKeys[keyIndex], { cluster: 'us2', forceTLS: true });

                    pusher.connection.bind('error', () => { pusher.disconnect(); keyIndex++; setTimeout(tryConnect, 1000); });

                    const channel = pusher.subscribe(`chatrooms.${chatroomId}.v2`);
                    channel.bind('App\\Events\\ChatMessageEvent', (data) => {
                        const username = data.sender.username;
                        const avatar = data.sender.identity.profile_pic || `https://ui-avatars.com/api/?name=${username}&background=random&color=fff&bold=true`;
                        this.masterQueue.push({ username, message: data.content, avatar, platform: 'kk' });
                    });
                };
                tryConnect();
            }

            processQueue() {
                if (this.masterQueue.length > 0) {
                    const msg = this.masterQueue.shift();
                    this.chatEngine.addMessage(msg.username, msg.message, msg.avatar, msg.platform);
                }
            }

            runDemoMode() {
                document.getElementById('node-yt').style.display = 'flex';
                document.getElementById('node-tw').style.display = 'flex';
                document.getElementById('node-kk').style.display = 'flex';
                
                setInterval(() => this.viewerEngine.update('yt', Math.floor(Math.random() * 50) + 1200), 5000);
                setInterval(() => {
                    this.viewerEngine.update('tw', Math.floor(Math.random() * 20) + 800);
                    this.viewerEngine.update('kk', Math.floor(Math.random() * 100) + 2100);
                }, 8000);

                const users = ["DwightMain", "TrapperBoi", "Nea_Toxicity", "HexRuin", "EntityEnjoyer"];
                
                const triggerRandomChat = () => {
                    const platforms = ['yt', 'tw', 'kk'];
                    const plt = platforms[Math.floor(Math.random() * platforms.length)];
                    const user = users[Math.floor(Math.random() * users.length)];
                    const avatar = `https://ui-avatars.com/api/?name=${user}&background=random&color=fff&bold=true`;
                    
                    this.masterQueue.push({ 
                        username: user, 
                        message: "Farming Bloodpoints! The decay makes me want to spam chat so I don't lose Iridescent Rank!", 
                        avatar: avatar, platform: plt 
                    });
                    
                    setTimeout(triggerRandomChat, Math.floor(Math.random() * 1000) + 800);
                }
                setTimeout(triggerRandomChat, 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const gameEngine = new DBDGamificationEngine();
            const chatEngine = new ZeroGPUChatEngine(gameEngine);
            const viewerEngine = new ViewerEngine();
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('user') || '';
            
            new MasterUnifiedEngine(chatEngine, viewerEngine, username);
        });
    </script>
</body>
</html>
