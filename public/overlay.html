<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra-Premium Stream Status Overlay V5 - Kinetic Polish</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Syncopate:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Existing Premium Cinematic Palette - NO NEW COLORS */
            --void-obsidian: #020005;
            --void-deep: #05010a;
            --purple-core: #3a00ff;
            --purple-rich: #1d003b;
            --purple-neon: #a200ff;
            --cyan-neon: #00f3ff;
            --gold-dark: #8c6a00;
            --gold-pure: #ffcc00;
            
            --overlay-width: 840px; 
            --overlay-height: 72px;  
            --logo-size: 96px;       
            
            --sweep-progress: 0%; 
            --logo-rot: 0deg; 
            --ease-premium: cubic-bezier(0.25, 1, 0.3, 1); 
            --ease-slot: cubic-bezier(0.34, 1.56, 0.64, 1); /* Enhanced physical snap */
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 100vw; height: 100vh;
            background-color: transparent; 
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; color: white;
            display: flex; align-items: center; justify-content: center;
            padding: 50px; 
            -webkit-font-smoothing: antialiased; /* Sharper text */
        }

        .scene-container {
            position: relative; 
            width: var(--overlay-width); 
            height: var(--overlay-height);
            display: flex; align-items: center; z-index: 10;
        }

        /* Ambient Cinematic Backlight */
        .ambient-backlight {
            position: absolute; top: 50%; left: var(--sweep-progress);
            transform: translate(-50%, -50%); width: 450px; height: 160px;
            background: radial-gradient(ellipse at center, rgba(162, 0, 255, 0.3) 0%, rgba(0, 243, 255, 0.08) 40%, transparent 70%);
            z-index: 0; pointer-events: none; mix-blend-mode: screen; will-change: left;
        }

        .master-overlay-wrapper {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            padding: 2px; border-radius: 40px;
            background: linear-gradient(90deg, var(--purple-rich), var(--purple-neon), var(--cyan-neon), var(--purple-neon), var(--purple-rich));
            background-size: 200% 100%; 
            animation: borderFlow 6s linear infinite;
            filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 15px rgba(162, 0, 255, 0.4));
            clip-path: inset(0 calc(100% - var(--sweep-progress)) 0 0);
            z-index: 1; will-change: clip-path;
        }

        /* Frosted Glass Core with Idle Breathe */
        .overlay-core {
            position: relative; width: 100%; height: 100%;
            background-color: rgba(3, 0, 8, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 38px;
            overflow: hidden; 
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px 0 75px; 
            gap: 20px; z-index: 2;
            animation: coreBreathe 6s ease-in-out infinite alternate;
        }

        /* Physical Glass Noise Texture for true premium optics */
        .overlay-core::before {
            content: ""; position: absolute; inset: 0; z-index: 0; opacity: 0.04; mix-blend-mode: overlay; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Dynamic Light Sweep across the glass */
        .glass-reflection {
            position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            transform: skewX(-25deg);
            z-index: 9; pointer-events: none;
            animation: lightSweep 8s var(--ease-premium) infinite;
        }

        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; mix-blend-mode: color-dodge; }

        /* Sleek Logo Sweeper */
        .logo-sweeper {
            position: absolute; top: 50%; left: var(--sweep-progress);
            transform: translate(-50%, -50%); 
            width: var(--logo-size); height: var(--logo-size); z-index: 100;
            background-color: var(--void-deep); border-radius: 50%; padding: 4px;
            box-shadow: 0 15px 30px rgba(0,0,0,1), 0 0 20px rgba(162, 0, 255, 0.7), inset 0 0 15px rgba(0, 243, 255, 0.4);
            display: flex; justify-content: center; align-items: center;
            will-change: left, transform, box-shadow;
            transition: box-shadow 0.5s ease;
        }
        
        /* Idle floating animation applies only when resting */
        .logo-sweeper.is-resting { animation: floatLogo 5s ease-in-out infinite alternate; }

        .logo-inner-ring {
            width: 100%; height: 100%; border-radius: 50%; padding: 3px;
            background: linear-gradient(135deg, var(--gold-pure), var(--gold-dark), var(--cyan-neon));
            display: flex; justify-content: center; align-items: center;
            transform: rotate(var(--logo-rot)); will-change: transform;
        }
        
        .brand-logo {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            background-color: var(--void-obsidian); 
            border: 2px solid var(--void-deep);
            box-shadow: inset 0 0 12px rgba(0,0,0,1);
        }

        /* DATA MODULES */
        .data-module {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
            height: 100%; min-width: 85px; 
        }

        .data-label {
            font-family: 'Syncopate', sans-serif; font-size: 0.45rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.35em; color: var(--void-obsidian); 
            background: #ffffff; padding: 2px 6px; border-radius: 2px; margin-bottom: 4px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.9), 0 0 8px rgba(255,255,255,0.4);
        }

        .data-value {
            font-family: 'Montserrat', sans-serif; font-size: 1.6rem; font-weight: 900;
            line-height: 1; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; 
            color: #ffffff; 
            /* Hard black shadow for perfect scaling visibility, glowing neon shadow for effect */
            text-shadow: 0 4px 6px rgba(0, 0, 0, 1), 0 0 15px rgba(162, 0, 255, 0.7);
            height: 1em; overflow: hidden; display: flex; align-items: center;
            padding-bottom: 2px; /* Fixes descender clipping during spins */
        }

        /* ====== TRUE SLOT MACHINE CSS ====== */
        .slot-wrapper { display: inline-flex; height: 1em; line-height: 1; overflow: hidden; position: relative; padding: 0 1px; }
        .slot-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 0.3em; z-index: 5;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); pointer-events: none;
        }
        .slot-wrapper::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 0.3em; z-index: 5;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%); pointer-events: none;
        }
        .slot-reel { display: inline-flex; flex-direction: column; will-change: transform, filter; transform-origin: center; }
        .slot-num, .slot-comma { 
            display: flex; align-items: center; justify-content: center; height: 1em; 
            filter: blur(0px); transition: filter 0.1s, transform 0.1s;
        }
        
        /* Elastic stretch & motion blur during spin */
        .slot-reel.is-rolling { filter: blur(1.5px); transform-origin: center; }
        .slot-reel.is-rolling .slot-num { transform: scaleY(1.3); color: var(--cyan-neon); text-shadow: 0 0 10px var(--cyan-neon); }
        /* =================================== */

        .separator {
            position: relative; z-index: 10; width: 2px; height: 32px;
            background: rgba(255, 255, 255, 0.1); border-radius: 2px;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.3), 0 0 12px rgba(162, 0, 255, 0.6);
        }

        /* Cyber-Track Goal Bar */
        .goal-module {
            display: flex; flex-direction: column; justify-content: center;
            flex-grow: 1; min-width: 190px; z-index: 10; position: relative;
        }

        .goal-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }

        .goal-title {
            font-family: 'Syncopate', sans-serif; font-size: 0.45rem; font-weight: 900;
            color: var(--void-obsidian); background: var(--cyan-neon);
            padding: 2px 6px; border-radius: 2px; letter-spacing: 0.25em;
            box-shadow: 0 3px 6px rgba(0,0,0,0.9), 0 0 12px rgba(0, 243, 255, 0.5);
        }

        .goal-numbers {
            font-size: 0.85rem; font-weight: 900; color: #ffffff; letter-spacing: 1px;
            font-variant-numeric: tabular-nums; 
            text-shadow: 0 2px 5px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.3s var(--ease-premium);
        }

        .progress-track {
            position: relative; width: 100%; height: 14px;
            background: rgba(0,0,0,0.85); overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,1), 0 1px 0 rgba(255,255,255,0.1);
        }

        .progress-fill {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%; z-index: 1;
            background: linear-gradient(90deg, var(--purple-core), var(--cyan-neon));
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
            transition: width 1s var(--ease-premium);
            overflow: hidden;
        }

        /* Kinetic energy flow inside the bar */
        .progress-fill::before {
            content: ''; position: absolute; top: 0; left: 0; width: 200%; height: 100%;
            background: repeating-linear-gradient(
                -45deg, 
                transparent, transparent 8px, 
                rgba(255,255,255,0.25) 8px, rgba(255,255,255,0.25) 16px
            );
            animation: kineticFlow 1s linear infinite;
        }

        /* NEW: Glowing Laser Scan effect sweeping across the filled bar */
        .progress-laser {
            position: absolute; top: 0; left: -30px; height: 100%; width: 30px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            filter: blur(2px); mix-blend-mode: overlay;
            animation: laserSweep 3s infinite;
        }

        /* Laser Spark Edge */
        .progress-fill::after {
            content: ''; position: absolute; right: 0; top: 0; height: 100%; width: 4px;
            background: #ffffff; border-radius: 2px;
            box-shadow: -2px 0 12px #ffffff, 0 0 25px var(--cyan-neon);
        }

        .goal-flash .progress-fill { filter: brightness(1.5); box-shadow: 0 0 40px var(--cyan-neon); }
        .goal-flash .goal-numbers { transform: scale(1.15); color: var(--cyan-neon); text-shadow: 0 0 20px var(--cyan-neon); }

        /* Ticker Module */
        .ticker-module {
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.5); border-left: 2px solid var(--cyan-neon);
            padding: 0 15px; height: 100%; width: 230px;
            position: relative; z-index: 10;
        }

        /* Live Audio EQ */
        .live-eq-container {
            display: flex; align-items: flex-end; gap: 3px;
            height: 14px; margin-right: 12px; flex-shrink: 0;
        }
        .eq-bar {
            width: 4px; background: var(--cyan-neon); border-radius: 2px;
            box-shadow: 0 0 10px var(--cyan-neon);
            transition: height 0.1s ease;
        }

        /* Gradient Mask for silky smooth text appearing/disappearing */
        .ticker-wrapper { 
            overflow: hidden; width: 100%; position: relative; height: 100%; display: flex; align-items: center;
            mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        /* Glowing text animation */
        .ticker-content {
            font-size: 0.75rem; font-weight: 900; color: #ffffff;
            letter-spacing: 1px; white-space: nowrap; transform: translateX(100%); will-change: transform;
            /* Base dark shadow for structure + glowing pulse animation */
            text-shadow: 0 2px 4px rgba(0,0,0,1);
            animation: textGlowPulse 2s ease-in-out infinite alternate;
        }

        /* Premium Animations */
        @keyframes borderFlow { 0% { background-position: 0% 50%; } 100% { background-position: -200% 50%; } }
        @keyframes lightSweep { 0%, 65% { left: -100%; } 100% { left: 200%; } }
        @keyframes kineticFlow { 0% { transform: translateX(0); } 100% { transform: translateX(-32px); } }
        @keyframes laserSweep { 0%, 20% { left: -30px; opacity: 0; } 50% { opacity: 1; } 80%, 100% { left: 100%; opacity: 0; } }
        
        /* Pulse for marquee visibility */
        @keyframes textGlowPulse {
            0% { text-shadow: 0 2px 4px rgba(0,0,0,1), 0 0 5px rgba(255,255,255,0.4), 0 0 10px var(--cyan-neon); }
            100% { text-shadow: 0 2px 4px rgba(0,0,0,1), 0 0 12px rgba(255,255,255,0.9), 0 0 20px var(--cyan-neon), 0 0 30px var(--cyan-neon); }
        }

        /* Float effects */
        @keyframes floatLogo {
            0% { transform: translate(-50%, -50%); box-shadow: 0 15px 30px rgba(0,0,0,1), 0 0 20px rgba(162, 0, 255, 0.7), inset 0 0 15px rgba(0, 243, 255, 0.4); }
            100% { transform: translate(-50%, calc(-50% - 6px)); box-shadow: 0 25px 40px rgba(0,0,0,0.8), 0 0 35px rgba(162, 0, 255, 0.9), inset 0 0 25px rgba(0, 243, 255, 0.6); }
        }
        @keyframes coreBreathe {
            0% { box-shadow: inset 0 0 40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.1); }
            100% { box-shadow: inset 0 0 60px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,0.25), 0 5px 15px rgba(0,0,0,0.4); }
        }
        
    </style>
</head>
<body>

    <div class="scene-container" id="scene-wrapper">
        <div class="ambient-backlight"></div>

        <!-- Sleek Logo: Rotates via JS during sweep, floats gracefully during idle -->
        <div class="logo-sweeper" id="logo-sweeper">
            <div class="logo-inner-ring">
                <img src="../public/kk.jpg" alt="Logo" class="brand-logo" id="brand-logo" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
            </div>
        </div>

        <div class="master-overlay-wrapper" id="overlay">
            <div class="overlay-core">
                <div class="glass-reflection"></div>
                <canvas id="particle-canvas"></canvas> 

                <div class="data-module" id="mod-subs">
                    <div class="data-label">SUBS</div>
                    <!-- Slot Machine Target Div -->
                    <div class="data-value" id="val-subs">0</div>
                </div>

                <div class="separator"></div>

                <div class="data-module" id="mod-likes">
                    <div class="data-label">LIKES</div>
                    <div class="data-value" id="val-likes">0</div>
                </div>

                <div class="separator"></div>

                <div class="goal-module" id="mod-goal">
                    <div class="goal-header">
                        <span class="goal-title">SUB GOAL</span>
                        <span class="goal-numbers" id="val-goal">0 / 5,000</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="goal-bar">
                            <div class="progress-laser"></div>
                        </div>
                    </div>
                </div>

                <div class="ticker-module">
                    <div class="live-eq-container" id="live-eq">
                        <div class="eq-bar" style="height: 4px;"></div>
                        <div class="eq-bar" style="height: 10px;"></div>
                        <div class="eq-bar" style="height: 6px;"></div>
                    </div>
                    <div class="ticker-wrapper">
                        <div class="ticker-content" id="ticker-text">
                            INITIALIZING SYSTEM...
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // High-Fidelity Particle Engine
        class ParticleEngine {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId); this.ctx = this.canvas.getContext('2d');
                this.particles = []; this.isSweeping = false; this.sweepX = 0;
                window.particleEngineInstance = this; 
                this.resize(); window.addEventListener('resize', () => this.resize()); this.render();
            }
            resize() { this.canvas.width = this.canvas.clientWidth; this.canvas.height = this.canvas.clientHeight; }
            setSweeping(active, xPosition) { this.isSweeping = active; this.sweepX = xPosition; }
            
            spawnBurst(x, y) {
                for(let i=0; i<15; i++) {
                    this.particles.push({ 
                        x: x, y: y, 
                        vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, 
                        life: 1.0, decay: Math.random()*0.03+0.015, 
                        size: Math.random()*3.5+1.5,
                        color: Math.random() > 0.4 ? '#00f3ff' : '#ffffff',
                        isSquare: true
                    });
                }
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Ambient cinematic embers
                if(Math.random() > 0.6) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width, y: this.canvas.height + 5,
                        vx: (Math.random() - 0.5) * 1, vy: -(Math.random() * 2 + 1),
                        life: 1.0, decay: 0.015, size: Math.random() * 2 + 0.5,
                        color: 'rgba(0, 243, 255, 0.7)', isSquare: false
                    });
                }

                if (this.isSweeping) {
                    const px = (this.sweepX / 100) * this.canvas.width, py = this.canvas.height / 2;
                    for(let i=0; i<4; i++) this.particles.push({ 
                        x: px, y: py + (Math.random()*50-25), 
                        vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, 
                        life: 1.0, decay: Math.random()*0.05+0.02, size: Math.random()*2.5+1, color: '#a200ff', isSquare: true
                    });
                }

                for(let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i]; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                    if (p.life <= 0) { this.particles.splice(i, 1); continue; }
                    
                    this.ctx.fillStyle = p.color;
                    this.ctx.shadowBlur = 15; this.ctx.shadowColor = p.color;
                    this.ctx.globalAlpha = p.life;

                    if (p.isSquare) { this.ctx.fillRect(p.x, p.y, p.size, p.size); } 
                    else { this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); this.ctx.fill(); }
                }
                this.ctx.globalAlpha = 1.0;
                requestAnimationFrame(() => this.render());
            }
        }

        // Slot Machine Number Engine
        class SlotMachineOdometer {
            constructor(elementId) {
                this.el = document.getElementById(elementId);
                this.currentValStr = "";
            }

            update(newValue) {
                const newStr = newValue.toLocaleString('en-US');
                if (this.currentValStr === newStr) return;

                let html = `<div class="slot-wrapper">`;
                
                // Build a slot reel for every digit
                for (let i = 0; i < newStr.length; i++) {
                    const char = newStr[i];
                    if (char === ',') {
                        html += `<div class="slot-comma">,</div>`;
                    } else {
                        let spinCount = Math.floor(Math.random() * 5) + 6; // 6 to 10 digits to blur past
                        let reelHtml = '';
                        for(let j=0; j < spinCount; j++) {
                            reelHtml += `<div class="slot-num">${Math.floor(Math.random()*10)}</div>`;
                        }
                        reelHtml += `<div class="slot-num">${char}</div>`; 
                        html += `<div class="slot-reel" data-spins="${spinCount}">${reelHtml}</div>`;
                    }
                }
                html += `</div>`;
                
                this.el.innerHTML = html;
                const reels = this.el.querySelectorAll('.slot-reel');
                
                void this.el.offsetHeight; // Force reflow

                reels.forEach((reel, index) => {
                    reel.classList.add('is-rolling');
                    const spins = parseInt(reel.getAttribute('data-spins'));
                    const targetY = -(spins * 100); 
                    
                    // Stagger and snap physics
                    const delay = index * 0.035; 
                    const duration = 0.7 + (Math.random() * 0.3); 
                    
                    reel.style.transition = `transform ${duration}s var(--ease-slot) ${delay}s`;
                    reel.style.transform = `translateY(${targetY}%)`;

                    // Remove elastic state once settled
                    setTimeout(() => {
                        reel.classList.remove('is-rolling');
                    }, (duration + delay) * 1000);
                });

                // Spark Emitter on updated target
                if(window.particleEngineInstance) {
                    const rect = this.el.getBoundingClientRect();
                    const containerRect = document.getElementById('particle-canvas').getBoundingClientRect();
                    window.particleEngineInstance.spawnBurst(
                        (rect.left - containerRect.left) + rect.width/2, 
                        (rect.top - containerRect.top) + rect.height/2
                    );
                }

                this.currentValStr = newStr;
            }
        }

        // Live Audio Visualizer Simulator
        class AudioEQSimulator {
            constructor() {
                this.bars = document.querySelectorAll('.eq-bar');
                this.animate();
            }
            animate() {
                setInterval(() => {
                    this.bars.forEach(bar => {
                        const height = Math.floor(Math.random() * 12) + 3;
                        bar.style.height = `${height}px`;
                    });
                }, 100); 
            }
        }

        class OverlayState {
            constructor() {
                this.state = { subs: 0, likes: 0, goal: 5000 };
                this.subsSlot = new SlotMachineOdometer('val-subs');
                this.likesSlot = new SlotMachineOdometer('val-likes');
                this.elements = { 
                    goalMod: document.getElementById('mod-goal'), 
                    goalText: document.getElementById('val-goal'), 
                    goalBar: document.getElementById('goal-bar') 
                };
            }
            
            triggerSubGoalAnimation() {
                this.elements.goalMod.classList.remove('goal-flash');
                void this.elements.goalMod.offsetWidth; 
                this.elements.goalMod.classList.add('goal-flash');
                setTimeout(() => this.elements.goalMod.classList.remove('goal-flash'), 800);
            }

            updateData(newSubs, newLikes, newGoal) {
                if (newGoal) this.state.goal = newGoal;

                let subChanged = false;
                if (newSubs !== this.state.subs) { 
                    if (newSubs > this.state.subs && this.state.subs !== 0) subChanged = true;
                    this.subsSlot.update(newSubs);
                    this.state.subs = newSubs; 
                }
                if (newLikes !== this.state.likes) { 
                    this.likesSlot.update(newLikes);
                    this.state.likes = newLikes; 
                }
                
                let percentage = Math.max(0, Math.min(100, (this.state.subs / this.state.goal) * 100));
                this.elements.goalText.innerText = `${this.state.subs.toLocaleString()} / ${this.state.goal.toLocaleString()}`;
                this.elements.goalBar.style.width = `${percentage}%`;

                if (subChanged) this.triggerSubGoalAnimation();
            }
        }

        class TickerEngine {
            constructor() {
                this.element = document.getElementById('ticker-text'); 
                this.container = this.element.parentElement;
                this.queue = ["WELCOME TO THE STREAM • DROP A LIKE"];
                this.currentIndex = 0; 
                this.pos = this.container.offsetWidth; 
                this.speed = 0.7; 
                this.animate();
            }
            pushAlert(msg) { this.queue.splice(this.currentIndex + 1, 0, msg); }
            animate() {
                this.pos -= this.speed;
                if (this.pos < -this.element.offsetWidth - 50) {
                    this.currentIndex = (this.currentIndex + 1) % this.queue.length;
                    this.element.innerText = this.queue[this.currentIndex]; 
                    this.pos = this.container.offsetWidth;
                }
                this.element.style.transform = `translateX(${this.pos}px)`; 
                requestAnimationFrame(() => this.animate());
            }
        }

        class CinematicSweepController {
            constructor(particleEngine) {
                this.scene = document.getElementById('scene-wrapper'); 
                this.logo = document.getElementById('logo-sweeper');
                this.particleEngine = particleEngine;
                this.easeInOutExpo = (t) => t === 0 ? 0 : t === 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
                this.runCycle();
            }
            sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
            
            tweenSweep(startPct, endPct, duration) {
                return new Promise(resolve => {
                    let startTime = null; 
                    this.particleEngine.setSweeping(true, startPct);
                    this.logo.classList.remove('is-resting'); // Disable float during sweep
                    
                    const update = (currentTime) => {
                        if (!startTime) startTime = currentTime;
                        let progress = Math.min((currentTime - startTime) / duration, 1);
                        const currentPct = startPct + (endPct - startPct) * this.easeInOutExpo(progress);
                        
                        this.scene.style.setProperty('--sweep-progress', `${currentPct}%`);
                        this.particleEngine.setSweeping(true, currentPct);
                        
                        // LOGO ROTATION TIED DIRECTLY TO SWEEP PROGRESS
                        const rotDegrees = (currentPct / 100) * 1080; 
                        document.documentElement.style.setProperty('--logo-rot', `${rotDegrees}deg`);

                        if (progress < 1) requestAnimationFrame(update); else {
                            this.scene.style.setProperty('--sweep-progress', `${endPct}%`);
                            this.particleEngine.setSweeping(false, endPct); 
                            
                            // Re-enable floating idle animation if fully revealed
                            if(endPct === 100) this.logo.classList.add('is-resting');
                            
                            resolve();
                        }
                    };
                    requestAnimationFrame(update);
                });
            }
            
            async runCycle() {
                await this.sleep(1000);
                while(true) {
                    await this.tweenSweep(0, 100, 2200); 
                    await this.sleep(25000); 
                    await this.tweenSweep(100, 0, 2200); 
                    await this.sleep(3000); 
                }
            }
        }

        class LiveDemoEngine {
            constructor(state, ticker) {
                this.state = state; this.ticker = ticker;
                this.runLiveSimulation();
            }
            
            runLiveSimulation() {
                let s = 4280; let l = 950;
                this.state.updateData(s, l, 5000); 
                
                // Triggers exactly every 1.5s for the hyper-live feel
                setInterval(() => {
                    let updated = false;
                    if(Math.random() > 0.25) { l += Math.floor(Math.random() * 5) + 1; updated = true; }
                    if(Math.random() > 0.55) { 
                        let newSubs = Math.floor(Math.random() * 2) + 1;
                        s += newSubs; updated = true; 
                        if(newSubs > 1) this.ticker.pushAlert("!!! SUB BOMB ALERT !!!");
                    }
                    if (updated) this.state.updateData(s, l);
                }, 2500); 
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const particles = new ParticleEngine('particle-canvas');
            const state = new OverlayState();
            const ticker = new TickerEngine();
            new AudioEQSimulator();
            new CinematicSweepController(particles);
            new LiveDemoEngine(state, ticker); 
        });
    </script>
</body>
