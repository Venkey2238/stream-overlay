<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Status - Zero GPU Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Syncopate:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Void & Cyber Palette */
            --void-obsidian: #030008;
            --void-deep: #0a011a;
            --purple-rich: #4d0099;
            --purple-neon: #a200ff;
            --gold-dark: #b38600;
            --gold-pure: #ffd700;
            --neon-white: #ffffff;

            /* Hardware-Accelerated Easings */
            --ease-dopamine: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-slot: cubic-bezier(0.2, 0.9, 0.1, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 100vw; height: 100vh;
            background-color: transparent;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; color: white;
            display: flex; align-items: center; justify-content: center;
        }

        .obs-safe-zone {
            width: 1000px; height: 150px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Solid Vector Core - NO BLURS, NO SHADOWS */
        .master-bar {
            display: flex; align-items: stretch;
            height: 68px; width: 860px;
            background-color: rgba(3, 0, 8, 0.95);
            border: 2px solid rgba(162, 0, 255, 0.5);
            border-bottom: 4px solid var(--purple-neon);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transform-origin: center;
            animation: bootUp 0.8s var(--ease-dopamine) forwards;
            will-change: transform, opacity;
        }

        @keyframes bootUp {
            0% { opacity: 0; transform: scaleY(0.1) scaleX(0.8); }
            100% { opacity: 1; transform: scaleY(1) scaleX(1); }
        }

        /* 2D Background Grid (Static) */
        .grid-bg {
            position: absolute; inset: 0; z-index: 0; opacity: 0.2;
            background-image: linear-gradient(var(--purple-neon) 1px, transparent 1px), linear-gradient(90deg, var(--purple-neon) 1px, transparent 1px);
            background-size: 15px 15px;
            pointer-events: none;
        }

        /* Hardware-Accelerated Light Sweep */
        .light-sweep {
            position: absolute; top: 0; left: -20%; width: 10%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg); z-index: 10; pointer-events: none;
            animation: sweepPass 6s linear infinite;
            will-change: transform;
        }

        @keyframes sweepPass {
            0%, 70% { transform: translateX(0) skewX(-20deg); }
            100% { transform: translateX(10000%) skewX(-20deg); } /* Translates out of bounds cleanly */
        }

        /* Premium Static Crest */
        .logo-crest {
            position: relative; width: 85px; height: 100%;
            background: var(--void-obsidian);
            border-right: 2px solid var(--purple-neon);
            display: flex; justify-content: center; align-items: center;
            z-index: 5;
        }

        .brand-logo {
            width: 46px; height: 46px; border-radius: 50%;
            object-fit: cover; border: 2px solid var(--gold-pure);
            display: none;
        }

        /* Data Modules */
        .data-section {
            display: flex; align-items: center; gap: 20px;
            padding: 0 25px; border-right: 2px solid rgba(162, 0, 255, 0.3);
            z-index: 5;
        }

        .data-module {
            display: flex; flex-direction: column; justify-content: center;
        }

        .data-label {
            font-family: 'Syncopate', sans-serif; font-size: 0.5rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.2em; color: var(--purple-neon);
            margin-bottom: 2px;
        }

        /* High-Performance Slot Machine */
        .slot-container {
            display: flex; font-size: 1.5rem; font-weight: 900;
            line-height: 1; letter-spacing: 0.05em; font-variant-numeric: tabular-nums;
            color: var(--neon-white); height: 1.5rem; overflow: hidden;
        }

        .slot-digit { position: relative; width: 1rem; height: 100%; text-align: center; }
        .slot-digit.comma { width: 0.4rem; text-align: left; }

        .slot-strip {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            /* STRICTLY TRANSFORM ONLY - NO BLUR FILTERS */
            will-change: transform;
        }
        .slot-strip > span { height: 1.5rem; display: flex; justify-content: center; align-items: center; }

        /* Performance Sub Goal */
        .goal-module {
            flex-grow: 1; padding: 0 25px; display: flex; flex-direction: column;
            justify-content: center; z-index: 5;
        }

        .goal-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 6px;
        }

        .goal-title {
            font-family: 'Syncopate', sans-serif; font-size: 0.5rem; font-weight: 900;
            color: #000; background: var(--gold-pure);
            padding: 2px 6px; border-radius: 2px; letter-spacing: 0.15em;
        }

        .goal-numbers {
            font-size: 0.9rem; font-weight: 900; color: var(--neon-white);
            font-variant-numeric: tabular-nums;
            will-change: transform, color;
            transition: transform 0.3s var(--ease-dopamine), color 0.3s;
        }

        .progress-track {
            width: 100%; height: 12px; background: #000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px; overflow: hidden;
        }

        .progress-fill {
            height: 100%; width: 100%;
            background: linear-gradient(90deg, var(--purple-rich), var(--purple-neon), var(--gold-dark));
            transform-origin: left; transform: scaleX(0); /* GPU ACCELERATED SCALING */
            transition: transform 1.5s var(--ease-dopamine);
            will-change: transform;
        }

        .goal-flash .goal-numbers { transform: scale(1.15); color: var(--gold-pure); }

        /* Ticker Module */
        .ticker-module {
            display: flex; align-items: center; width: 220px;
            background: rgba(0, 0, 0, 0.6); border-left: 2px solid var(--purple-neon);
            padding: 0 15px; overflow: hidden; z-index: 5;
        }

        .live-dot {
            width: 8px; height: 8px; background: #00ffcc; border-radius: 50%;
            margin-right: 10px; flex-shrink: 0;
            animation: pulseDot 1s infinite alternate;
        }

        @keyframes pulseDot { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        .ticker-wrapper { overflow: hidden; width: 100%; position: relative; }
        
        .ticker-content {
            font-size: 0.75rem; font-weight: 900; color: var(--neon-white);
            letter-spacing: 1px; white-space: nowrap;
            will-change: transform; transform: translateX(100%);
        }

    </style>
</head>
<body>

<div class="obs-safe-zone">
    <div class="master-bar">
        <div class="grid-bg"></div>
        <div class="light-sweep"></div>

        <div class="logo-crest">
            <img src="" alt="Logo" class="brand-logo" id="brand-logo">
        </div>

        <div class="data-section">
            <div class="data-module" id="mod-subs">
                <div class="data-label">SUBS</div>
                <div class="slot-container" id="slot-subs"></div>
            </div>
            <div class="data-module" id="mod-likes">
                <div class="data-label">LIKES</div>
                <div class="slot-container" id="slot-likes"></div>
            </div>
        </div>

        <div class="goal-module" id="mod-goal">
            <div class="goal-header">
                <span class="goal-title">SUB GOAL</span>
                <span class="goal-numbers" id="val-goal">0 / 5,000</span>
            </div>
            <div class="progress-track">
                <!-- Zero GPU Scaling via transform: scaleX() -->
                <div class="progress-fill" id="goal-bar"></div>
            </div>
        </div>

        <div class="ticker-module">
            <div class="live-dot"></div>
            <div class="ticker-wrapper">
                <div class="ticker-content" id="ticker-text">CONNECTING TO LIVE FEED...</div>
            </div>
        </div>
    </div>
</div>

<script>
class SlotMachineDigit {
    constructor(char, delayOffset) {
        this.element = document.createElement('div');
        this.element.className = char === ',' ? 'slot-digit comma' : 'slot-digit';
        this.strip = document.createElement('div'); this.strip.className = 'slot-strip';
        this.element.appendChild(this.strip);
        this.isComma = char === ','; this.currentChar = char; this.delayOffset = delayOffset;
        this.buildStrip(char);
    }
    
    buildStrip(targetChar) {
        this.strip.innerHTML = ''; this.strip.style.transition = 'none';
        this.strip.style.transform = 'translateY(0)';
        if (this.isComma) { const span = document.createElement('span'); span.innerText = ','; this.strip.appendChild(span); return; }

        const startDigit = parseInt(this.currentChar) || 0;
        const targetDigit = parseInt(targetChar) || 0;
        this.currentChar = targetChar;

        let html = `<span>${startDigit}</span>`;
        for(let i=0; i<10; i++) html += `<span>${Math.floor(Math.random()*10)}</span>`;
        html += `<span>${targetDigit}</span>`;
        this.strip.innerHTML = html; void this.strip.offsetWidth;
    }

    rollToTarget() {
        if(this.isComma) return;
        const targetY = - (this.strip.children.length - 1) * this.element.offsetHeight;
        // Transform ONLY. No CSS filters to preserve GPU.
        this.strip.style.transition = `transform 1.2s var(--ease-slot) ${this.delayOffset}s`;
        this.strip.style.transform = `translateY(${targetY}px)`;
    }
}

class NumberSlotEngine {
    constructor(containerId) {
        this.container = document.getElementById(containerId);
        this.digits = []; this.currentString = "0"; this.updateDOM("0");
    }
    
    format(num) { return (num || 0).toLocaleString('en-US'); }
    
    updateDOM(newStr) {
        this.container.innerHTML = ''; this.digits = [];
        for(let i = 0; i < newStr.length; i++) {
            const delay = (newStr.length - 1 - i) * 0.05; // Tighter delay
            const digit = new SlotMachineDigit(newStr[i], delay);
            this.digits.push(digit); this.container.appendChild(digit.element);
        }
        this.currentString = newStr;
    }
    
    triggerRoll(newValue) {
        const targetStr = this.format(newValue);
        if(targetStr.length !== this.currentString.length) this.updateDOM(this.currentString);

        for(let i=0; i<targetStr.length; i++) {
            if(!this.digits[i]) {
                const delay = (targetStr.length - 1 - i) * 0.05;
                const newDigit = new SlotMachineDigit(targetStr[i], delay);
                this.digits.push(newDigit); this.container.appendChild(newDigit.element);
            } else { this.digits[i].buildStrip(targetStr[i]); }
        }
        this.currentString = targetStr;
        this.digits.forEach(digit => digit.rollToTarget());
    }
}

class TickerEngine {
    constructor() {
        this.element = document.getElementById('ticker-text'); 
        this.container = this.element.parentElement;
        this.queue = ["AWAITING LIVE FEED..."]; this.currentIndex = 0;
        this.pos = this.container.offsetWidth; this.speed = 1.2; this.animate();
    }
    setMessages(messageString) {
        const parts = messageString.split(',').map(m => m.trim()).filter(m => m.length > 0);
        if(parts.length > 0) this.queue = parts;
    }
    animate() {
        this.pos -= this.speed;
        if (this.pos < -this.element.offsetWidth - 20) {
            this.currentIndex = (this.currentIndex + 1) % this.queue.length;
            this.element.innerText = this.queue[this.currentIndex];
            this.pos = this.container.offsetWidth;
        }
        // GPU safe translation
        this.element.style.transform = `translateX(${this.pos}px)`; 
        requestAnimationFrame(() => this.animate());
    }
}

class OverlayState {
    constructor() {
        this.state = { subs: 0, likes: 0, goal: 5000 };
        this.slotSubs = new NumberSlotEngine('slot-subs');
        this.slotLikes = new NumberSlotEngine('slot-likes');
        this.elements = { 
            goalMod: document.getElementById('mod-goal'), 
            goalText: document.getElementById('val-goal'), 
            goalBar: document.getElementById('goal-bar') 
        };
        this.rollInterval = setInterval(() => { this.executeRoll(); }, 5500);
    }
    
    format(num) { return (num || 0).toLocaleString('en-US'); }
    
    triggerSubGoalAnimation() {
        this.elements.goalMod.classList.remove('goal-flash'); void this.elements.goalMod.offsetWidth;
        this.elements.goalMod.classList.add('goal-flash'); 
        setTimeout(() => this.elements.goalMod.classList.remove('goal-flash'), 1000);
    }
    
    executeRoll() { this.slotSubs.triggerRoll(this.state.subs); this.slotLikes.triggerRoll(this.state.likes); }
    
    updateData(newSubs, newLikes, newGoal) {
        if (newGoal) this.state.goal = newGoal;
        let subChanged = false;

        if (newSubs !== this.state.subs) {
            if (newSubs > this.state.subs && this.state.subs !== 0) subChanged = true;
            this.state.subs = newSubs;
        }
        if (newLikes !== this.state.likes) { this.state.likes = newLikes; }

        // ScaleX is virtually free for the GPU compared to animating Width
        let percentage = Math.max(0, Math.min(1, (this.state.subs / this.state.goal)));
        this.elements.goalText.innerText = `${this.format(this.state.subs)} / ${this.format(this.state.goal)}`;
        this.elements.goalBar.style.transform = `scaleX(${percentage})`;

        if (subChanged) { this.triggerSubGoalAnimation(); this.executeRoll(); }
    }
}

class MultiStreamerLiveEngine {
    constructor(state, ticker) {
        this.state = state; this.ticker = ticker;
        const urlParams = new URLSearchParams(window.location.search);
        this.username = urlParams.get('user') || '';

        if (!this.username) {
            this.ticker.setMessages("ERROR: NO USER SPECIFIED IN URL");
            return;
        }
        this.pollData();
        setInterval(() => this.pollData(), 10000);
    }

    async pollData() {
        try {
            const res = await fetch(`/api/streamer/${this.username}?t=${new Date().getTime()}`);
            if (!res.ok) return;
            const data = await res.json();

            if (data.authenticated) {
                this.state.updateData(data.subs, data.likes, data.sub_goal);
                if (data.ticker_text) this.ticker.setMessages(data.ticker_text);
                
                if (data.avatar) {
                    const logoEl = document.getElementById('brand-logo');
                    if (logoEl.src !== data.avatar) {
                        logoEl.src = data.avatar;
                        logoEl.style.display = 'block';
                    }
                }
            }
        } catch(e) {}
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const state = new OverlayState();
    const ticker = new TickerEngine();
    new MultiStreamerLiveEngine(state, ticker);
});
</script>
</body>
</html>
